<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Português a Valer 1 — ежедневный тренажёр</title>
<style>
:root{
  --bg:#faf7f2; --panel:#fff; --ink:#1d1b18; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#0a6b4d; --accent-soft:#e3f1ea; --warn:#b3261e; --warn-soft:#fbe9e7;
  --gold:#b98900; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14130f; --panel:#1d1c18; --ink:#f0ece5; --muted:#a09a90; --line:#2f2d27;
        --accent:#4cc79b; --accent-soft:#12352a; --warn:#ff8a80; --warn-soft:#3a1c19;
        --gold:#e0b34d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.chip b{color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px 18px;
  font-weight:600;font-size:15px;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.hot{border-color:var(--warn);color:var(--warn);font-weight:700}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  text-align:left;transition:border-color .15s,transform .05s}
.mode:hover{border-color:var(--accent)}
.mode:active{transform:scale(.99)}
.mode .t{font-weight:640;font-size:14.5px;margin-bottom:3px}
.mode .d{font-size:12.5px;color:var(--muted);line-height:1.4}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* --- session --- */
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.prompt{font-size:24px;line-height:1.35;font-weight:600;letter-spacing:-.02em;margin:2px 0 6px}
.prompt.pt{font-style:normal}
.prompt small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0}
.gapline{font-size:20px;line-height:1.5;font-weight:500}
.gapline u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 22px}
input.answer{width:100%;font:inherit;font-size:19px;padding:13px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:14px}
input.answer:focus{outline:none;border-color:var(--accent)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.accents button{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  min-width:34px;height:32px;font-size:15px;color:var(--ink)}
.accents button:hover{background:var(--accent-soft)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);
  border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:16.5px;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt .k{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:6px;background:var(--line);font-size:12px;color:var(--muted);flex:none}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--warn);background:var(--warn-soft)}
.verdict{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:15px;line-height:1.5}
.verdict.ok{background:var(--accent-soft);border:1px solid var(--accent)}
.verdict.no{background:var(--warn-soft);border:1px solid var(--warn)}
.verdict .big{font-size:18px;font-weight:640;letter-spacing:-.01em}
.verdict .ru{color:var(--muted);font-size:14px;margin-top:4px}
.diff b{background:rgba(185,137,0,.28);border-radius:3px;padding:0 1px}
.wr{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:3px;font-weight:600}
.miss{opacity:.55;text-decoration:line-through}
.speak{background:none;border:none;color:var(--muted);font-size:17px;padding:2px 6px;border-radius:8px}
.speak:hover{background:var(--accent-soft);color:var(--accent)}
.ruleref{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.ruleref b{color:var(--ink)}
table.conj{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
table.conj td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.conj td:first-child{color:var(--muted);width:42%}
table.conj tr.hi td{background:var(--accent-soft);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.02em}
.rule{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--panel);overflow:hidden}
.rule>summary{padding:14px 16px;cursor:pointer;font-weight:620;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.rule>summary::-webkit-details-marker{display:none}
.rule>summary:after{content:"›";margin-left:auto;color:var(--muted);transform:rotate(90deg);transition:.2s}
.rule[open]>summary:after{transform:rotate(270deg)}
.rule .body{padding:0 16px 16px;font-size:14.5px;line-height:1.6}
.rule .ex{margin-top:10px;border-left:2px solid var(--accent);padding-left:12px}
.rule .ex div{margin-bottom:7px}
.rule .ex .p{font-weight:560}
.rule .ex .r{color:var(--muted);font-size:13.5px}
.statline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.statline .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:99px;background:var(--line);width:90px;overflow:hidden;flex:none}
.mini>i{display:block;height:100%;background:var(--accent)}
label.set{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px}
label.set input,label.set select{margin-left:auto;font:inherit}
.hidden{display:none!important}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent)}
.dots i.bad{background:var(--warn)}
.done-hero{text-align:center;padding:26px 10px}
.done-hero .em{font-size:44px}
.done-hero h3{margin:10px 0 6px;font-size:20px}
kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
</style>
</head>

"theme":"festas"},{"pt":"faca","art":"a","ru":"нож","unit":7,"theme":"mesa"},{"pt":"garfo","art":"o","ru":"вилка","unit":7,"theme":"mesa"},{"pt":"colher","art":"a","ru":"ложка","unit":7,"theme":"mesa"},{"pt":"copo","art":"o","ru":"стакан","unit":7,"theme":"mesa"},{"pt":"prato","art":"o","ru":"тарелка, блюдо","unit":7,"theme":"mesa"},{"pt":"guardanapo","art":"o","ru":"салфетка","unit":7,"theme":"mesa"},{"pt":"garrafa","art":"a","ru":"бутылка","unit":7,"theme":"mesa"},{"pt":"toalha","art":"a","ru":"скатерть, полотенце","unit":7,"theme":"mesa"},{"pt":"férias","art":"as","ru":"отпуск, каникулы","unit":8,"theme":"viagens"},{"pt":"viagem","art":"a","ru":"поездка","unit":8,"theme":"viagens"},{"pt":"praia","art":"a","ru":"пляж","unit":8,"theme":"viagens"},{"pt":"montanha","art":"a","ru":"гора","unit":8,"theme":"viagens"},{"pt":"mar","art":"o","ru":"море","unit":8,"theme":"viagens"},{"pt":"ilha","art":"a","ru":"остров","unit":8,"theme":"viagens"},{"pt":"aeroporto","art":"o","ru":"аэропорт","unit":8,"theme":"viagens"},{"pt":"passaporte","art":"o","ru":"паспорт","unit":8,"theme":"viagens"},{"pt":"voo","art":"o","ru":"рейс","unit":8,"theme":"viagens"},{"pt":"destino","art":"o","ru":"направление, пункт назначения","unit":8,"theme":"viagens"},{"pt":"monumento","art":"o","ru":"памятник","unit":8,"theme":"viagens"},{"pt":"mercado","art":"o","ru":"рынок","unit":8,"theme":"viagens"},{"pt":"caminhada","art":"a","ru":"прогулка пешком, поход","unit":8,"theme":"tempos livres"},{"pt":"mergulho","art":"o","ru":"дайвинг","unit":8,"theme":"tempos livres"},{"pt":"escalada","art":"a","ru":"скалолазание","unit":8,"theme":"tempos livres"},{"pt":"esqui","art":"o","ru":"лыжи","unit":8,"theme":"tempos livres"},{"pt":"campismo","art":"o","ru":"кемпинг","unit":8,"theme":"tempos livres"},{"pt":"piquenique","art":"o","ru":"пикник","unit":8,"theme":"tempos livres"},{"pt":"passeio","art":"o","ru":"прогулка","unit":8,"theme":"tempos livres"},{"pt":"ontem","art":null,"ru":"вчера","unit":8,"theme":"marcadores"},{"pt":"hoje","art":null,"ru":"сегодня","unit":8,"theme":"marcadores"},{"pt":"amanhã","art":null,"ru":"завтра","unit":8,"theme":"marcadores"},{"pt":"na semana passada","art":null,"ru":"на прошлой неделе","unit":8,"theme":"marcadores"},{"pt":"no mês passado","art":null,"ru":"в прошлом месяце","unit":8,"theme":"marcadores"},{"pt":"no ano passado","art":null,"ru":"в прошлом году","unit":8,"theme":"marcadores"},{"pt":"já","art":null,"ru":"уже","unit":8,"theme":"marcadores"},{"pt":"ainda não","art":null,"ru":"ещё не","unit":8,"theme":"marcadores"}],"rules":[{"id":"ser_estar","unit":2,"title":"Ser или estar","body":"<b>ser</b> — постоянный признак: кто это, откуда, кем работает, какой по характеру.<br><b>estar</b> — состояние и местонахождение прямо сейчас: где, как себя чувствует, какой в данный момент.","ex":[["A Yudith é da Venezuela.","Юдит из Венесуэлы. (происхождение → ser)"],["A Valentina está sempre alegre.","Валентина всегда весёлая. (состояние → estar)"],["O António é arquiteto.","Антониу — архитектор. (профессия → ser)"],["As irmãs da Margarida estão no Algarve.","Сёстры Маргариды в Алгарве. (место → estar)"]]},{"id":"artigos","unit":1,"title":"Артикли","body":"Определённые: <b>o / a / os / as</b>. Ставятся перед именами людей, названиями стран и некоторых городов: <i>o Paulo, a Ana, a França, o Porto</i>.<br>Неопределённые: <b>um / uma / uns / umas</b>.<br>Перед названиями городов артикля обычно нет: <i>em Lisboa, de Coimbra</i>, но <i>no Porto, no Rio de Janeiro</i>.<br><br><b>Первое упоминание → um/uma, дальше → o/a.</b> Когда предмет появляется в рассказе впервые (новый для слушателя), берём неопределённый артикль; когда возвращаемся к нему — определённый: <i>A Rita tem <b>um</b> presente. <b>O</b> presente é <b>um</b> livro.</i>","ex":[["Eu sou a Teresa.","Я Тереза."],["A Ana mora num apartamento. O apartamento tem uma varanda.","Ана живёт в (какой-то) квартире. В (этой) квартире есть балкон."],["Precisamos de um mapa.","Нам нужна карта (какая-нибудь)."],["O Paulo e a Ana são irmãos.","Паулу и Ана — брат и сестра."]]},{"id":"pres_regulares","unit":3,"title":"Presente do Indicativo — правильные глаголы","body":"<b>-ar</b>: -o, -as, -a, -amos, -am (falar → falo, falas, fala, falamos, falam)<br><b>-er</b>: -o, -es, -e, -emos, -em (comer → como, comes, come, comemos, comem)<br><b>-ir</b>: -o, -es, -e, -imos, -em (decidir → decido, decides, decide, decidimos, decidem)<br>Графические изменения в 1 л. ед. ч.: <i>conhecer → conheço, descer → desço, vestir → visto, preferir → prefiro, conseguir → consigo, dormir → durmo, pedir → peço, perder → perco</i>.","ex":[["Eu vivo em Leiria.","Я живу в Лейрии."],["Vocês conhecem Portugal?","Вы знаете Португалию?"],["Ela prefere alimentos sem glúten.","Она предпочитает еду без глютена."]]},{"id":"reflexos","unit":3,"title":"Возвратные глаголы и место местоимения","body":"Обычно местоимение стоит <b>после</b> глагола через дефис: <i>chamo-me, levanto-me, veste-se</i>.<br>В 1 л. мн. ч. -s исчезает: <i>chamamos + nos → chamamo-nos</i>.<br>Местоимение уходит <b>перед</b> глаголом после: <i>não, nunca, também, só, já, que, onde, como, porque, todos</i> и в вопросах с вопросительным словом.","ex":[["Eu chamo-me Rafaela.","Меня зовут Рафаэла."],["Eu não me chamo Rafaela.","Меня не зовут Рафаэла. (отрицание → перед глаголом)"],["Como te chamas?","Как тебя зовут? (вопросительное слово → перед глаголом)"],["Eu visto-me quando me levanto.","Я одеваюсь, когда встаю."]]},{"id":"de_em_paises","unit":1,"title":"Предлоги de и em: страны и города","body":"<b>de</b> + происхождение (с глаголом ser): <i>Nós somos da Argentina.</i><br><b>em</b> + место жительства (с глаголом morar): <i>Nós moramos em Portimão.</i><br>Со странами артикль есть → предлог сливается: <b>de + a = da, de + o = do, em + a = na, em + o = no</b>.<br>С городами артикля обычно нет: <i>de Braga, em Lisboa</i>. Исключения: <i>no Porto, no Rio de Janeiro</i>.","ex":[["A Margarida é de Braga.","Маргарида из Браги."],["O Sr. Pereira mora na Rússia.","Сеньор Перейра живёт в России."],["Eu sou de Portugal e moro no Porto.","Я из Португалии и живу в Порту."]]},{"id":"possessivos","unit":2,"title":"Притяжательные","body":"Согласуются с <b>предметом</b>, а не с владельцем, и обычно идут с артиклем: <i>o meu carro, a minha casa, os meus livros, as minhas chaves</i>.<br>eu → meu/minha · tu → teu/tua · você, ele, ela → seu/sua (или dele/dela) · nós → nosso/nossa · vocês, eles → vosso/vossa (или deles/delas).","ex":[["Emília, esta garrafa de água é tua?","Эмилия, это твоя бутылка воды?"],["Peter e Elena, têm os vossos cadernos?","Питер и Елена, у вас есть ваши тетради?"],["A mãe dela é professora.","Её мама — учительница."]]},{"id":"prep_tempo","unit":3,"title":"Предлоги времени a, de, em","body":"<b>a</b> — часы, части дня, дни недели как <i>привычка</i>: <i>às 17:00, à noite, à segunda-feira</i><br><b>de</b> — часть дня после указания часа: <i>às cinco da tarde</i>; <i>de manhã, de tarde, de noite</i><br><b>em</b> — дни недели как <i>разовое событие</i>: <i>no domingo, na sexta-feira</i><br>Слияния: a+o=ao, a+a=à, a+os=aos, a+as=às · de+o=do, de+a=da · em+o=no, em+a=na","ex":[["À sexta-feira à noite, costumo ir ao cinema.","По пятницам вечером я обычно хожу в кино. (привычка)"],["No domingo, vamos ao Porto?","В воскресенье поедем в Порту? (разовое)"],["Ele chega às cinco da tarde.","Он приходит в пять вечера."]]},{"id":"ter_de","unit":4,"title":"Ter de + инфинитив","body":"Выражает <b>необходимость и обязанность</b>: «должен, надо».<br>tenho de · tens de · tem de · temos de · têm de + инфинитив.","ex":[["Está muito frio. Temos de vestir o casaco.","Очень холодно. Нам надо надеть куртку."],["Tu tens de comer melhor.","Тебе нужно лучше питаться."],["Elas têm de apanhar o metro.","Им надо сесть на метро."]]},{"id":"estar_a","unit":4,"title":"Estar a + инфинитив (настоящее продолженное)","body":"Действие происходит <b>прямо сейчас</b>, в момент речи.<br>estou a · estás a · está a · estamos a · estão a + инфинитив.<br>У возвратных глаголов местоимение переходит к инфинитиву: <i>estou a levantar-me</i>.","ex":[["Eu estou a ler o livro.","Я сейчас читаю книгу."],["Agora, a Rute está a estudar, porque tem exame amanhã.","Сейчас Рут занимается, потому что завтра экзамен."],["Tu estás a pentear-te.","Ты сейчас причёсываешься."]]},{"id":"comparativo","unit":4,"title":"Сравнительная степень: больше / меньше","body":"<b>mais</b> + прилагательное/наречие + <b>do que</b><br><b>menos</b> + прилагательное/наречие + <b>do que</b><br>Исключения: bom → <b>melhor do que</b> · mau → <b>pior do que</b> · grande → <b>maior do que</b>.","ex":[["Eu sou mais alto do que o meu irmão.","Я выше своего брата."],["Este prato é menos caro do que aquele.","Это блюдо дешевле того."],["Lisboa é maior do que Coimbra.","Лиссабон больше Коимбры."]]},{"id":"prep_movimento","unit":4,"title":"Предлоги движения a, para, por","body":"<b>a</b> — ненадолго, с возвращением: <i>Vou à padaria e volto já.</i><br><b>para</b> — надолго или конечный пункт: <i>Vou para a biblioteca. Até logo!</i><br><b>por</b> — путь, маршрут: <i>Hoje, vamos pela avenida.</i><br>por + o = pelo, por + a = pela, por + os = pelos, por + as = pelas","ex":[["A Maria vai para Portimão passar férias.","Мария едет в Портиман на отпуск."],["Eu vou a casa e volto já.","Я схожу домой и сразу вернусь."],["Hoje, a Rita passa pela casa da avó.","Сегодня Рита заходит к бабушке."]]},{"id":"transportes","unit":4,"title":"Транспорт: de или em","body":"<b>de</b> + транспорт вообще, без уточнения: <i>de carro, de autocarro, de avião</i>. Исключение: <b>ir a pé</b> — идти пешком.<br><b>em</b> + конкретный транспорт: <i>no avião da TAP, no carro do meu pai, no elétrico n.º 28</i>.","ex":[["O Juan vai de mota para o trabalho.","Хуан ездит на работу на мотоцикле."],["Nós vamos para os Açores no avião da TAP.","Мы летим на Азоры самолётом TAP."],["Muitos alunos vão a pé para a escola.","Многие ученики ходят в школу пешком."]]},{"id":"com_pronome","unit":4,"title":"Предлог com + местоимение","body":"com + eu → <b>comigo</b> · com + tu → <b>contigo</b> · com + você/о senhor → <b>consigo</b> · com + nós → <b>connosco</b> · com + vocês/os senhores → <b>convosco</b><br>С ela/ele/elas/eles ничего не сливается: <i>com ela, com eles</i>.","ex":[["Ela vai comigo ao oculista.","Она идёт со мной к окулисту."],["Carlos, eu vou contigo ao hospital.","Карлуш, я пойду с тобой в больницу."],["A Bruna estuda convosco?","Бруна занимается с вами?"]]},{"id":"ir_inf","unit":5,"title":"Ir + инфинитив (будущее)","body":"Планы и действия в будущем: «собираюсь / буду».<br>vou · vais · vai · vamos · vão + инфинитив.","ex":[["Eu vou sair de casa às 9:00.","Я выйду из дома в 9:00."],["Vocês vão arrendar um apartamento nas férias.","Вы снимете квартиру на отпуск."],["Amanhã, vai chover.","Завтра будет дождь."]]},{"id":"saber_conhecer","unit":5,"title":"Conhecer, saber, conseguir, poder","body":"<b>conhecer</b> — быть знакомым: место, книга, человек.<br><b>saber</b> — знать факт; уметь (навык).<br><b>conseguir</b> — быть в состоянии, справляться физически.<br><b>poder</b> — возможность, разрешение; в отрицании — запрет.","ex":[["Eu não conheço o Alentejo.","Я не знаю (не бывала в) Алентежу."],["Ele sabe cozinhar pratos tailandeses.","Он умеет готовить тайские блюда."],["Eu não consigo dizer esta palavra.","У меня не получается произнести это слово."],["Na biblioteca, nós não podemos falar ao telemóvel.","В библиотеке нельзя говорить по телефону."]]},{"id":"ha_desde","unit":5,"title":"Há и desde","body":"<b>há</b> + <i>отрезок</i> времени: сколько времени уже длится. <i>há dois anos, há um mês</i><br><b>desde</b> + <i>точка отсчёта</i>: с какого момента. <i>desde 2020, desde criança, desde que...</i><br>Оба употребляются с настоящим временем.","ex":[["O Yasir vive em Portugal há dois anos.","Ясир живёт в Португалии два года."],["O Cristiano está na biblioteca desde o início da tarde.","Криштиану в библиотеке с начала дня."],["A Olívia faz campismo desde criança.","Оливия ходит в походы с детства."]]},{"id":"igualdade","unit":5,"title":"Сравнение равенства: tão / tanto ... como","body":"<b>tão</b> + прилагательное/наречие + <b>como</b><br><b>tanto/tanta/tantos/tantas</b> + существительное + <b>como</b> (согласуется с существительным).","ex":[["A Francisca é tão alta como a irmã.","Франсишка такая же высокая, как сестра."],["O Luís tem tantas férias como a minha namorada.","У Луиша столько же отпуска, сколько у моей девушки."],["Eu bebo tanta água como tu.","Я пью столько же воды, сколько ты."]]},{"id":"ci_pronome","unit":5,"title":"Местоимения косвенного дополнения (кому?)","body":"me · te · lhe (você, ela, ele) · nos · vos · lhes<br>Обычно <b>после</b> глагола через дефис: <i>A Sara dá-lhe o casaco.</i><br><b>Перед</b> глаголом — после não, nunca, também, só, já, que, onde и вопросительных слов.","ex":[["A Sara dá-lhe o casaco.","Сара даёт ему куртку."],["O Peter não lhe telefona.","Питер ей не звонит."],["Nós emprestamos-lhe o caderno.","Мы одалживаем ему тетрадь."]]},{"id":"prep_pronome","unit":5,"title":"para, por, sem, de + местоимение","body":"para <b>mim</b> · para <b>ti</b> · para <b>si</b> (você, о senhor) · para ela/ele · para nós · para vocês · para elas/eles.<br>Так же с <i>por, sem, de</i>: <i>sem mim, por ti, de ti</i>.","ex":[["Para ti, qual é a melhor praia portuguesa?","Какой, по-твоему, лучший португальский пляж?"],["Podes ir ao cinema sem mim.","Можешь пойти в кино без меня."],["Dr. Pedro, este dossiê é para si.","Доктор Педру, эта папка для вас."]]},{"id":"em_meses","unit":5,"title":"Предлог em: месяцы, времена года, праздники","body":"С месяцами — просто <b>em</b>: <i>em junho, em janeiro</i>.<br>С временами года — <b>с артиклем</b>: <i>na primavera, no verão, no outono, no inverno</i>.<br>С праздниками — тоже с артиклем: <i>no Natal, na Páscoa, no Ano Novo</i>.","ex":[["A Isabel vai fazer uma viagem em junho.","Изабел поедет в путешествие в июне."],["Na primavera, gosto de passear pelos campos.","Весной я люблю гулять по полям."],["No Natal, costumamos comer bacalhau.","На Рождество мы обычно едим треску."]]},{"id":"conectores","unit":5,"title":"Союзы e, mas, porque, quando","body":"<b>e</b> — добавление · <b>mas</b> — противопоставление · <b>porque</b> — причина · <b>quando</b> — время.","ex":[["A Luísa vive junto ao mar, mas não gosta de peixe.","Луиза живёт у моря, но не любит рыбу."],["A Mariana está cansada porque trabalha muito.","Мариана устала, потому что много работает."],["Quando está sol, vamos correr à beira-mar.","Когда солнечно, мы бегаем у моря."]]},{"id":"imperativo","unit":6,"title":"Императив: informal (tu) и formal (você)","body":"<b>tu</b>: берём форму 3 л. ед. ч. настоящего времени → <i>ele compra → Compra os medicamentos!</i><br><b>você</b>: берём 1 л. ед. ч. и меняем окончание:<br>-ar → <b>-e</b>: eu procuro → <i>procure</i> · -er → <b>-a</b>: eu como → <i>coma</i> · -ir → <b>-a</b>: eu visto → <i>vista</i><br>Глагол pôr идёт по правилу -er: eu ponho → <i>ponha</i>.","ex":[["Fátima, procure a ficha do doente no arquivo.","Фатима, найдите карту пациента в архиве."],["Rita, coma alimentos mais saudáveis.","Рита, ешьте более здоровую еду."],["Faz este exercício antes de a aula acabar.","Сделай это упражнение до конца урока."]]},{"id":"para_por","unit":6,"title":"Para и por","body":"<b>para</b>: цель (<i>para ganhar mais</i>), направление/пункт назначения (<i>vão para Lisboa</i>), мнение (<i>para nós, é o melhor</i>).<br><b>por</b>: причина (<i>por ter alergias</i>), маршрут (<i>passam por Coimbra</i>), продолжительность (<i>por um mês</i>), приблизительное время (<i>pelas onze</i>).","ex":[["Ele trabalha muito para ganhar mais dinheiro.","Он много работает, чтобы больше зарабатывать."],["A Marta espirra muito por ter alergias.","Марта часто чихает из-за аллергии."],["Nós devemos chegar ao Porto pelas 20:00.","Мы должны приехать в Порту около 20:00."]]},{"id":"tao_tanto","unit":7,"title":"Tão и tanto в восклицаниях","body":"<b>tão</b> + прилагательное или наречие: <i>O Luís é tão tímido!</i><br><b>tanto / tanta / tantos / tantas</b> + существительное (согласуется в роде и числе): <i>tanto açúcar, tanta fome, tantos doces, tantas horas</i>.","ex":[["Hoje, tenho tanta fome!","Сегодня я такая голодная!"],["Tu falas tão baixo!","Ты говоришь так тихо!"],["A Cátia trabalha tantas horas!","Катя работает столько часов!"]]},{"id":"indefinidos","unit":7,"title":"Неопределённые местоимения","body":"Изменяемые: algum/alguma/alguns/algumas · nenhum/nenhuma · muito · pouco · todo · outro — согласуются с существительным.<br>Неизменяемые: <b>alguém / ninguém</b> (о людях), <b>tudo / nada</b> (о вещах).","ex":[["Vês alguém no jardim?","Ты видишь кого-то в саду?"],["Eu não conheço ninguém na festa.","Я никого не знаю на вечеринке."],["Vou para Cabo Verde todos os anos.","Я езжу в Кабо-Верде каждый год."]]},{"id":"marcadores_temp","unit":7,"title":"antes de, depois de, quando, enquanto","body":"<b>antes de</b> — до (действие раньше) · <b>depois de</b> — после · <b>quando</b> — в момент действия · <b>enquanto</b> — одновременно, пока.<br>antes/depois + de сливается с артиклем: <i>antes do Carnaval, depois da aula</i>.","ex":[["Antes do Carnaval, as crianças escolhem os disfarces.","Перед карнавалом дети выбирают костюмы."],["Eu tomo um café depois do almoço.","Я пью кофе после обеда."],["A Luísa faz os convites enquanto o marido reserva o restaurante.","Луиза делает приглашения, пока муж бронирует ресторан."]]},{"id":"pps_regulares","unit":8,"title":"Pretérito Perfeito Simples — правильные глаголы","body":"Завершённое действие в прошлом.<br><b>-ar</b>: -ei, -aste, -ou, -ámos, -aram (trabalhar → trabalhei, trabalhaste, trabalhou, trabalhámos, trabalharam)<br><b>-er</b>: -i, -este, -eu, -emos, -eram (comer → comi, comeste, comeu, comemos, comeram)<br><b>-ir</b>: -i, -iste, -iu, -imos, -iram (vestir → vesti, vestiste, vestiu, vestimos, vestiram)<br>Орфография в 1 л. ед. ч.: <i>ficar → fiquei · pagar → paguei · começar → comecei</i>.","ex":[["Eu não trabalhei esta semana.","Я не работала на этой неделе."],["No domingo passado, nós comemos cachupa.","В прошлое воскресенье мы ели кашупу."],["Ontem, o Tiago vestiu o casaco.","Вчера Тиагу надел куртку."]]},{"id":"pps_irregulares","unit":8,"title":"PPS — неправильные: ir/ser, estar, ter","body":"<b>ir</b> и <b>ser</b> совпадают: fui, foste, foi, fomos, foram<br><b>estar</b>: estive, estiveste, esteve, estivemos, estiveram<br><b>ter</b>: tive, tiveste, teve, tivemos, tiveram","ex":[["No sábado à noite, tu foste ao cinema?","В субботу вечером ты ходила в кино?"],["Ontem, o empregado foi muito simpático.","Вчера официант был очень любезен."],["Hoje de manhã, a Annika teve um acidente.","Сегодня утром у Анники была авария."]]},{"id":"pps_marcadores","unit":8,"title":"Маркеры прошедшего времени","body":"ontem · na semana passada · no mês passado · no ano passado · em 2020 · <b>já</b> (уже) · <b>nunca</b> (никогда) · <b>ainda não</b> (ещё не).","ex":[["Nós já fomos ao Gerês.","Мы уже были в Жерес."],["Tu nunca estiveste em minha casa.","Ты никогда не была у меня дома."],["A Teresa ainda não chegou a Cabo Verde.","Тереза ещё не приехала в Кабо-Верде."]]},{"id":"lugar","unit":2,"title":"Выражения места","body":"dentro de · ao lado de · em frente de · atrás de · debaixo de · em cima de · entre<br>Все с <b>de</b>, а значит сливаются с артиклем: <i>ao lado do estojo, debaixo da mesa</i>.","ex":[["O livro está ao lado do estojo.","Книга рядом с пеналом."],["O sapato está debaixo da mesa.","Туфля под столом."],["O gato está entre a mesa e a mala.","Кот между столом и сумкой."]]},{"id":"contracoes","unit":3,"title":"Слияния предлогов с артиклями","body":"de + o/a/os/as = <b>do, da, dos, das</b><br>em + o/a/os/as = <b>no, na, nos, nas</b><br>a + o/a/os/as = <b>ao, à, aos, às</b><br>por + o/a/os/as = <b>pelo, pela, pelos, pelas</b>","ex":[["A Rita é de Lisboa, mas mora em Coimbra.","Рита из Лиссабона, но живёт в Коимбре."],["Brasília é a capital do Brasil.","Бразилиа — столица Бразилии."],["O metro passa pela Avenida da Liberdade.","Метро проходит по Авениде да Либердаде."]]}],"gaps":[{"rule":"de_em_paises","s":"A Augusta é ___ Camarões.","a":"dos","alts":[],"unit":1,"hint":"os Camarões"},{"rule":"de_em_paises","s":"A Sari e eu somos ___ Filipinas.","a":"das","alts":[],"unit":1,"hint":"as Filipinas"},{"rule":"de_em_paises","s":"O Philip é ___ Alemanha.","a":"da","alts":[],"unit":1,"hint":"a Alemanha"},{"rule":"de_em_paises","s":"O Kevin é ___ Chile.","a":"do","alts":[],"unit":1,"hint":"o Chile"},{"rule":"de_em_paises","s":"Nós somos ___ Países Baixos.","a":"dos","alts":[],"unit":1,"hint":"os Países Baixos"},{"rule":"de_em_paises","s":"O Xavier e a Helena são ___ Portugal.","a":"de","alts":[],"unit":1,"hint":"Portugal — без артикля"},{"rule":"de_em_paises","s":"A Margarida é ___ Braga.","a":"de","alts":[],"unit":1,"hint":"город без артикля"},{"rule":"de_em_paises","s":"O Zein é ___ Índia.","a":"da","alts":[],"unit":1,"hint":"a Índia"},{"rule":"de_em_paises","s":"A Carla mora ___ Luanda.","a":"em","alts":[],"unit":1,"hint":"город без артикля"},{"rule":"de_em_paises","s":"A Chiara mora ___ Berlim.","a":"em","alts":[],"unit":1,"hint":""},{"rule":"de_em_paises","s":"A Mikaela é ___ Grécia.","a":"da","alts":[],"unit":1,"hint":"a Grécia"},{"rule":"de_em_paises","s":"O João mora ___ Brasil.","a":"no","alts":[],"unit":1,"hint":"o Brasil"},{"rule":"de_em_paises","s":"O Sr. Pereira mora ___ Rússia.","a":"na","alts":[],"unit":1,"hint":"a Rússia"},{"rule":"de_em_paises","s":"Eu sou de Portugal e moro ___ Porto.","a":"no","alts":[],"unit":1,"hint":"o Porto — исключение"},{"rule":"prep_tempo","s":"O comboio parte ___ nove e meia ___ manhã.","a":"às|da","alts":[],"unit":3,"hint":"часы + часть дня"},{"rule":"prep_tempo","s":"___ tarde, o meu pai dorme uma sesta.","a":"À","alts":["A"],"unit":3,"hint":"часть дня"},{"rule":"prep_tempo","s":"Nós saímos de casa ___ meio-dia.","a":"ao","alts":[],"unit":3,"hint":""},{"rule":"prep_t   items:{}, streak:0, lastDay:null, hist:{}, newToday:0, newDay:null,
  set:{ len:20, newPerDay:20, strict:true, speak:true, units:[1,2,3,4,5,6,7,8],
        focus:{conj:30, trans:25, rules:30, vocab:15} }
};
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r&&r.items){ r.set = Object.assign({}, DEF.set, r.set||{}); return r; } }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
const today = () => new Date().toISOString().slice(0,10);
const dayNum = d => Math.floor(new Date(d+'T00:00:00').getTime()/864e5);

/* ---------- Leitner ---------- */
const BOX_DAYS = [0,1,3,7,16,35];
function meta(id){ return S.items[id] || (S.items[id] = {b:0,due:null,r:0,w:0}); }
function schedule(id, ok){
  const m = meta(id);
  m.b = ok ? Math.min(5, m.b+1) : (m.b>=3 ? 1 : 0);
  ok ? m.r++ : m.w++;
  const d = new Date(); d.setDate(d.getDate() + BOX_DAYS[m.b]);
  m.due = d.toISOString().slice(0,10);
  m.seen = today();
}
const isDue = id => { const m=S.items[id]; return m && m.due && m.due <= today(); };
const isNew = id => !S.items[id] || S.items[id].due === null;

/* ---------- нормализация и сверка ---------- */
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s){
  return (s||'').toLowerCase().trim()
    .replace(/[«»""'']/g,'"').replace(/\s+/g,' ')
    .replace(/[.!?;,]+$/,'').replace(/\s([.,!?;:])/g,'$1');
}
const canon = s => norm(s).replace(/[.,!?;:«»"()]/g,'').replace(/\s+/g,' ').trim();
function check(given, answers){
  const g = canon(given);
  for(const a of answers){ if(g === canon(a)) return {ok:true, target:a}; }
  for(const a of answers){ if(strip(g) === strip(canon(a))) return {ok:!S.set.strict, near:true, target:a}; }
  // ближайший ответ для показа
  let best = answers[0], bs = -1;
  for(const a of answers){ const s = sim(g, norm(a)); if(s>bs){bs=s;best=a;} }
  return {ok:false, near:false, target:best};
}
function simTok(s){ return strip((s||'').toLowerCase()).split(/\s+/)
  .map(w=>w.replace(/[^a-z0-9-]/g,'')).filter(Boolean); }
function sim(a,b){ // доля общих слов (по нормализованной форме)
  const A = simTok(a), B = simTok(b);
  if(!A.length || !B.length) return 0;
  const setB = new Map(); B.forEach(w=>setB.set(w,(setB.get(w)||0)+1));
  let n=0; for(const w of A){ const c=setB.get(w)||0; if(c>0){ n++; setB.set(w,c-1); } }
  return 2*n/(A.length+B.length);
}
function diffHtml(given, target){
  const g = given.trim(), t = target;
  let out = '', i = 0;
  const gs = strip(g.toLowerCase()), ts = strip(t.toLowerCase());
  if(gs === ts){ // только диакритика
    for(i=0;i<t.length;i++){
      const same = g[i] && g[i].toLowerCase() === t[i].toLowerCase();
      out += same ? esc(t[i]) : '<b>'+esc(t[i])+'</b>';
    }
    return out;
  }
  return esc(t);
}
const esc = s => (s+'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* пословный дифф: LCS по нормализованным словам */
function wordDiff(given, target){
  const tokG = given.trim().split(/\s+/), tokT = target.trim().split(/\s+/);
  const nG = tokG.map(w=>strip(norm(w))), nT = tokT.map(w=>strip(norm(w)));
  const m = nG.length, n = nT.length;
  const L = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    L[i][j] = nG[i]===nT[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const okG = new Array(m).fill(false), okT = new Array(n).fill(false);
  let i=0, j=0;
  while(i<m && j<n){
    if(nG[i]===nT[j]){ okG[i]=true; okT[j]=true; i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) i++;
    else j++;
  }
  const exactT = {}; tokT.forEach((w,k)=>{ exactT[nT[k]] = exactT[nT[k]]||w; });
  const givenHtml = tokG.map((w,k)=>{
    if(!okG[k]) return `<span class="wr">${esc(w)}</span>`;
    const tw = exactT[nG[k]];
    if(tw && norm(w)!==norm(tw)) return `<span class="wr">${esc(w)}</span>`;
    return esc(w);
  }).join(' ');
  const targetHtml = tokT.map((w,k)=> okT[k] ? esc(w) : `<b>${esc(w)}</b>`).join(' ');
  return {givenHtml, targetHtml};
}

/* ---------- озвучка ---------- */
let voices = [];
function pickVoice(){
  voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='pt-PT') || voices.find(v=>v.lang&&v.lang.startsWith('pt')) || null;
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
function say(text){
  if(!S.set.speak || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/_+/g,' … '));
  const v = pickVoice(); if(v) u.voice = v;
  u.lang = 'pt-PT'; u.rate = .92;
  speechSynthesis.speak(u);
}

/* ---------- сборка пула заданий ---------- */
const PERSONS = DATA.persons;
const TENSES = {
  pres:  {name:'Presente do Indicativo', short:'настоящее'},
  estar: {name:'Estar a + Infinitivo',   short:'происходит сейчас'},
  ir:    {name:'Ir + Infinitivo',        short:'будущее'},
  pps:   {name:'Pretérito Perfeito Simples do Indicativo (PPS)', short:'простое прошедшее'}
};
const ESTAR = ['estou a','estás a','está a','estamos a','estão a'];
const IR    = ['vou','vais','vai','vamos','vão'];
const REFL  = ['me','te','se','nos','se'];

function conjForm(v, tense, p){
  if(tense==='pres') return v.pres[p];
  if(tense==='pps')  return v.pps ? v.pps[p] : null;
  if(v.impersonal && p!==2 && p!==4) return null;
  const inf = v.refl ? v.inf.slice(0,-2) + REFL[p] : v.inf;   // levantar-se → levantar-me
  const aux = (tense==='estar'?ESTAR:IR)[v.impersonal?2:p];
  return aux + ' ' + inf;
}

let POOL = [];
function buildPool(){
  POOL = [];
  // лексика
  DATA.vocab.forEach((w,i)=>{
    POOL.push({id:'v'+i, kind:'vocab', pt:w.pt, ru:w.ru, art:w.art, unit:w.unit, theme:w.theme, group:'vocab'});
    if(w.art) POOL.push({id:'g'+i, kind:'gender', pt:w.pt, ru:w.ru, art:w.art, unit:w.unit, theme:w.theme, group:'vocab'});
  });
  // спряжения
  DATA.verbs.forEach((v,i)=>{
    ['pres','estar','ir','pps'].forEach(t=>{
      if(t==='pps' && !v.pps) return;
      if(v.impersonal && (t==='estar')) return;
      POOL.push({id:'c'+i+t, kind:'conj', vi:i, tense:t, unit:v.unit, group:'conj',
                 rule: t==='pres'?'pres_regulares': t==='estar'?'estar_a': t==='ir'?'ir_inf':(v.pps&&DATA.ppsIrr.includes(v.inf)?'pps_irregulares':'pps_regulares')});
    });
  });
  DATA.gaps.forEach((x,i)=> POOL.push({id:'x'+i, kind:'gap', i, unit:x.unit, rule:x.rule, group:'rules'}));
  DATA.mc.forEach((x,i)=>  POOL.push({id:'m'+i, kind:'mc',  i, unit:x.unit, rule:x.rule, group:'rules'}));
  DATA.trans.forEach((x,i)=>POOL.push({id:'t'+i, kind:'trans', i, unit:x.unit, rule:x.rule, group:'trans'}));
  POOL = POOL.filter(p => S.set.units.includes(p.unit));
}

/* ---------- подбор сессии ---------- */
function pickSession(n, filter){
  const pool = POOL.filter(filter || (()=>true));
  const due = pool.filter(p=>isDue(p.id));
  due.sort((a,b)=> (S.items[a.id].due||'').localeCompare(S.items[b.id].due||''));
  const out = due.slice(0, n);
  if(out.length < n){
    if(S.newDay !== today()){ S.newDay = today(); S.newToday = 0; }
    let budget = filter ? 999 : Math.max(0, S.set.newPerDay - S.newToday);
    const fresh = shuffle(pool.filter(p=>isNew(p.id)));
    const w = S.set.focus, quota = {conj:0,trans:0,rules:0,vocab:0};
    const need = n - out.length;
    Object.keys(quota).forEach(k => quota[k] = Math.round(need * w[k]/100));
    for(const p of fresh){
      if(out.length>=n || budget<=0) break;
      const g = p.group;
      if(quota[g] > 0){ out.push(p); quota[g]--; budget--; }
    }
    for(const p of fresh){ if(out.length>=n||budget<=0) break; if(!out.includes(p)){ out.push(p); budget--; } }
    // если дневной лимит новых исчерпан, всё равно добираем сессию до полной длины
    for(const p of fresh){ if(out.length>=n) break; if(!out.includes(p)) out.push(p); }
  }
  if(out.length < n){ // добираем слабыми
    const weak = pool.filter(p=>S.items[p.id] && !out.includes(p))
                     .sort((a,b)=> (S.items[b.id].w||0)-(S.items[a.id].w||0));
    out.push(...weak.slice(0, n-out.length));
  }
  return shuffle(out);
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* ---------- формирование вопроса ---------- */
function makeQ(p){ if(p._pre) return p._pre;
  const q = {p, id:p.id};
  if(p.kind==='vocab'){
    const m = S.items[p.id];
    const production = m && m.b >= 2;      // сначала узнавание, потом производство
    if(production){
      q.type='input'; q.label='Переведите на португальский';
      q.prompt=p.ru; q.answers=[p.pt, (p.art? p.art+' '+p.pt : p.pt)];
      q.speakAfter=p.pt; q.note = p.art ? 'артикль не обязателен' : '';
    }else{
      q.type='choice'; q.label='Что это значит?'; q.prompt=(p.art? p.art+' ':'')+p.pt;
      q.speakNow=p.pt;
      const others = shuffle(DATA.vocab.filter(w=>w.theme===p.theme && w.ru!==p.ru)).slice(0,3);
      while(others.length<3){ const c=rnd(DATA.vocab); if(c.ru!==p.ru && !others.includes(c)) others.push(c); }
      q.options = shuffle([p.ru, ...others.map(o=>o.ru)]); q.correct=p.ru;
    }
  }
  else if(p.kind==='gender'){
    q.type='choice'; q.label='Какой артикль?'; q.prompt='___ '+p.pt;
    q.sub=p.ru; q.options=['o','a','os','as']; q.correct=p.art; q.speakAfter=p.art+' '+p.pt;
  }
  else if(p.kind==='conj'){
    const v = DATA.verbs[p.vi];
    let ps = [0,1,2,3,4].filter(i => conjForm(v,p.tense,i));
    const i = rnd(ps), form = conjForm(v,p.tense,i);
    q.type='input'; q.label=TENSES[p.tense].name;
    q.conj={v, tense:p.tense, person:i};
    q.prompt=`${PERSONS[i]} — <span style="color:var(--accent)">${v.inf}</span>`;
    q.sub=`${v.ru} · ${TENSES[p.tense].short}`;
    q.answers=[form];
    if(!v.impersonal) PERSONS[i].split(', ').forEach(pr=> q.answers.push(pr+' '+form));
    q.speakAfter=form;
  }
  else if(p.kind==='gap'){
    const g = DATA.gaps[p.i];
    q.type='input'; q.label='Вставьте пропущенное';
    q.gap=g.s; q.answers=[g.a, ...(g.alts||[])]; q.note=g.hint||'';
    q.speakAfter=g.s.replace(/___/g, g.a.replace(/\|/g,' … '));
  }
  else if(p.kind==='mc'){
    const m = DATA.mc[p.i];
    q.type='choice'; q.label='Выберите правильный вариант'; q.gap=m.s;
    q.options=shuffle([m.a, ...m.wrong]); q.correct=m.a; q.note=m.hint||'';
    q.speakAfter=m.s.replace(/___/g, m.a);
  }
  else if(p.kind==='trans'){
    const t = DATA.trans[p.i];
    q.type='input'; q.label='Переведите на португальский'; q.prompt=t.ru;
    q.answers=[t.pt, ...(t.alts||[])]; q.speakAfter=t.pt; q.big=true;
  }
  q.rule = p.rule;
  return q;
}

/* ---------- сессия ---------- */
let SES = null;
function startSession(filter, title){
  buildPool();
  const items = pickSession(S.set.len, filter);
  if(!items.length){ alert('Нет заданий по этому фильтру — проверьте выбранные юниты в настройках.'); return; }
  SES = {queue:items.map(makeQ), i:0, right:0, wrong:0, again:[], title:title||'Ежедневная тренировка', log:[]};
  renderSession();
}
function renderSession(){
  const v = document.getElementById('view');
  if(SES.i >= SES.queue.length) return finishSession();
  const q = SES.queue[SES.i];
  const n = SES.queue.length, prog = Math.round(SES.i/n*100);
  let body = '';
  const speakBtn = q.speakAfter||q.speakNow ? `<button class="speak" id="sp" title="Прослушать">🔊</button>` : '';
  const head = `<div class="qtype">${esc(q.label)}${SES.repeat?' · повтор':''} ${speakBtn}</div>`;

  if(q.gap){
    body += `<div class="gapline">${q.gap.replace(/___/g,'<u>&nbsp;</u>')}</div>`;
  }else{
    body += `<div class="prompt${q.big?'':' pt'}">${q.prompt}${q.sub?`<small>${esc(q.sub)}</small>`:''}</div>`;
  }
  if(q.type==='input'){
    body += `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="${q.big?'португальская фраза…':'ответ…'}">`;
    body += `<div class="accents">` + ['á','à','â','ã','ç','é','ê','í','ó','ô','õ','ú'].map(c=>`<button data-c="${c}">${c}</button>`).join('') + `</div>`;
    if(q.note) body += `<div class="small muted" style="margin-top:8px">💡 ${esc(q.note)}</div>`;
    body += `<div class="row" style="margin-top:14px"><button class="btn" id="go">Проверить</button>
             <button class="btn ghost" id="skip">Не знаю</button>
             <button class="btn ghost" id="dict" title="Продиктовать (pt-PT)">🎤</button></div>`;
  }else{
    body += `<div class="opts">` + q.options.map((o,i)=>
      `<button class="opt" data-o="${esc(o)}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('') + `</div>`;
  }
  const dots = SES.queue.map((_,i)=>`<i class="${SES.log[i]===1?'done':SES.log[i]===0?'bad':''}"></i>`).join('');
  v.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn ghost small" id="quit" style="padding:6px 10px;font-size:13px">← выйти</button>
        <span class="small muted">${SES.i+1} / ${n}</span>
        <div class="dots">${dots}</div>
      </div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      ${head}${body}
      <div id="verdict"></div>
    </div>`;
  document.getElementById('quit').onclick = ()=>{ SES=null; save(); home(); };
  const sp = document.getElementById('sp'); if(sp) sp.onclick = ()=> say(q.speakNow||q.speakAfter);
  if(q.speakNow) setTimeout(()=>say(q.speakNow), 250);
  if(q.type==='input'){
    const inp = document.getElementById('ans'); inp.focus();
    document.querySelectorAll('.accents button').forEach(b=> b.onclick=()=>{
      const s=inp.selectionStart; inp.value = inp.value.slice(0,s)+b.dataset.c+inp.value.slice(inp.selectionEnd);
      inp.focus(); inp.selectionStart=inp.selectionEnd=s+1; });
    document.getElementById('go').onclick = ()=> answer(q, inp.value);
    document.getElementById('skip').onclick = ()=> answer(q, '', true);
    const dictBtn = document.getElementById('dict');
    if(typeof SR!=='undefined' && SR) dictBtn.onclick = ()=> toggleDictation(inp, dictBtn);
    else dictBtn.style.display='none';
    inp.onkeydown = e=>{
      if(e.key==='Escape' && typeof stopDictation==='function'){ e.preventDefault(); stopDictation(); return; }
      if(e.key==='Enter'){ e.preventDefault(); answer(q, inp.value); } };
  }else{
    document.querySelectorAll('.opt').forEach(b=> b.onclick = ()=> answer(q, b.dataset.o));
    document.onkeydown = e=>{ const n=parseInt(e.key); if(n>=1&&n<=q.options.length){ const b=document.querySelectorAll('.opt')[n-1]; b&&b.click(); } };
  }
}

function answer(q, given, skipped){
  if(typeof stopDictation==='function') stopDictation();
  let res;
  if(q.type==='choice') res = {ok: !skipped && norm(given)===norm(q.correct), target:q.correct};
  else res = skipped ? {ok:false, target:q.answers[0]} : check(given, q.answers);
  if(skipped) res.ok = false;
  const ok = res.ok;
  schedule(q.id, ok);
  SES.log[SES.i] = ok?1:0;
  SES.answers = SES.answers || [];
  SES.answers.push({q: q.gap || q.prompt.replace(/<[^>]+>/g,''), given: (given||'').trim(),
                    target: res.target, ok, near: !!res.near});
  ok ? SES.right++ : SES.wrong++;
  if(!ok) SES.again.push(q.p);
  const d = today(); S.hist[d] = S.hist[d] || {n:0,ok:0}; S.hist[d].n++; if(ok) S.hist[d].ok++;
  if(isNewCounted(q.id)) S.newToday++;
  save();

  // визуальная разметка вариантов
  if(q.type==='choice'){
    document.querySelectorAll('.opt').forEach(b=>{
      if(norm(b.dataset.o)===norm(q.correct)) b.classList.add('ok');
      else if(norm(b.dataset.o)===norm(given)) b.classList.add('no');
      b.onclick=null;
    });
  }
  const inp = document.getElementById('ans'); if(inp) inp.disabled = true;
  const go = document.getElementById('go'); if(go) go.remove();
  const sk = document.getElementById('skip'); if(sk) sk.remove();

  let html = '';
  const target = res.target;
  if(ok){
    html = `<div class="verdict ok"><div class="big">✓ ${esc(target)}</div>`;
  }else if(res.near){
    const d = wordDiff(given, target);
    html = `<div class="verdict no">
      <div class="ru" style="font-size:16px;margin-bottom:6px">вы: ${d.givenHtml}</div>
      <div class="big diff">${d.targetHtml}</div>
      <div class="ru">не хватает диакритики</div>`;
  }else{
    if(given.trim()){
      const d = wordDiff(given, target);
      html = `<div class="verdict no">
        <div class="ru" style="font-size:16px;margin-bottom:6px">вы: ${d.givenHtml}</div>
        <div class="big diff">${d.targetHtml}</div>`;
    }else{
      html = `<div class="verdict no"><div class="big">${esc(target)}</div>`;
    }
  }
  if(q.p.kind==='trans' && q.p.i!==undefined){ const t=DATA.trans[q.p.i]; html += `<div class="ru">${esc(t.ru)}</div>`; }
  if(q.p.kind==='vocab' || q.p.kind==='gender'){ html += `<div class="ru">${esc(q.p.ru)}</div>`; }
  html += `</div>`;
  if(q.conj) html += conjTable(q.conj);
  if(q.rule) html += ruleRef(q.rule);
  html += `<div class="row" style="margin-top:14px"><button class="btn wide" id="next">Дальше →</button></div>`;
  document.getElementById('verdict').innerHTML = html;
  if(q.speakAfter) say(q.speakAfter);
  const nx = document.getElementById('next');
  nx.focus();
  const armed = Date.now();
  nx.onclick = ()=>{ if(Date.now()-armed < 700) return; SES.i++; document.onkeydown=null; renderSession(); };
  document.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nx.click(); } };
}
function isNewCounted(id){ const m=S.items[id]; return m && m.r+m.w===1; }

function conjTable(c){
  const v = c.v, rows = [0,1,2,3,4].map(i=>{
    const f = conjForm(v, c.tense, i); if(!f) return '';
    return `<tr class="${i===c.person?'hi':''}"><td>${PERSONS[i]}</td><td>${esc(f)}</td></tr>`;
  }).join('');
  return `<div class="ruleref"><b>${v.inf}</b> — ${esc(v.ru)} · ${TENSES[c.tense].name}
          <table class="conj">${rows}</table></div>`;
}
function ruleRef(id){
  const r = DATA.rules.find(x=>x.id===id); if(!r) return '';
  return `<div class="ruleref">📘 <b>${esc(r.title)}</b><br>${r.body}</div>`;
}

function finishSession(){
  const total = SES.right + SES.wrong;
  const pct = total ? Math.round(SES.right/total*100) : 0;
  const d = today();
  if(S.lastDay !== d){
    S.streak = (S.lastDay && dayNum(d)-dayNum(S.lastDay)===1) ? S.streak+1 : 1;
    S.lastDay = d;
  }
  save();
  const em = pct>=90?'🎉':pct>=70?'👏':'💪';
  const againPs = [...new Map(SES.again.map(p=>[p.id,p])).values()];
  const sesTitle = SES.title;
  let recap = '';
  if(SES.storyDone){
    const st = SES.storyDone;
    recap = `<div class="card"><h2>${esc(st.title)} — вся история</h2>` +
      st.phrases.map(ph=>`<div style="margin-bottom:9px"><div style="font-weight:560">${esc(ph.pt)}

/* одна фраза во всех лицах и временах: presente → estar a → ir → PPS */
function lessonNum(){ return dayNum(today()) + (S.lessonOffset||0); }
function verbOfDay(){
  const drills = DATA.verbDrills.filter(d => S.set.units.includes(d.unit));
  return drills[lessonNum() % drills.length];
}
const U_SUBJ = ["У меня","У тебя","У неё","У нас","У них"];
const BE_PAST = ["была","был(а)","была","были","были"];
function ruPhrase(d, tense, p){
  const subj = DATA.subjRu[p];
  if(d.inf==='estar'){
    if(tense==='pres') return `${subj} сейчас ${d.objRu}.`;
    return `Вчера ${subj.toLowerCase()} ${BE_PAST[p]} ${d.objRu}.`;
  }
  if(d.inf==='ter'){
    if(tense==='pres') return `${U_SUBJ[p]} ${d.objRu}.`;
    if(tense==='ir') return `Завтра ${U_SUBJ[p].toLowerCase()} будет ${d.objRu}.`;
    return `Вчера ${U_SUBJ[p].toLowerCase()} был ${d.objRu}.`;
  }
  if(tense==='pres') return `${subj} ${d.ruPres[p]} ${d.objRu}.`;
  if(tense==='estar') return `${subj} сейчас ${d.ruPres[p]} ${d.objRu}.`;
  if(tense==='ir'){
    const rf = DATA.ruFut[d.inf];
    return rf ? `${subj} ${rf[p]} ${d.objRu}.` : `${subj} ${DATA.futRu[p]} ${d.ruInf} ${d.objRu}.`;
  }
  const v = p===0||p===2 ? d.ruPastF : (p===1 ? d.ruPastF.replace(/ла( |$)/,'л(а)$1') : d.ruPastP);
  return `Вчера ${subj.toLowerCase()} ${v} ${d.objRu}.`;
}
function ptPhrase(d, tense, p){
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  const f = conjForm(v, tense, p);
  if(!f) return null;
  const subj = DATA.subjPt[p];
  let pre = '';
  if(tense==='pps') pre = 'Ontem, ';
  if(tense==='ir' && d.inf==='ter') pre = 'Amanhã, ';
  const sj = pre ? (subj==='Eu'?'eu':subj[0].toLowerCase()+subj.slice(1)) : subj;
  return `${pre}${pre? sj.charAt(0)+sj.slice(1) : subj} ${f} ${d.obj}.`;
}
function ptVariants(pt){
  const out = [pt];
  const noAdv = pt.replace(/^(Ontem|Amanhã), /,'');
  if(noAdv!==pt) out.push(noAdv.charAt(0).toUpperCase()+noAdv.slice(1));
  for(const base of [...out]){
    const m = base.match(/^(Ontem, |Amanhã, )?(eu|tu|ela|nós|eles)\s+(.+)$/i);
    if(m){
      const rest = m[3];
      const v = (m[1]||'') + rest.charAt(0).toUpperCase() + rest.slice(1);
      if(!out.includes(v)) out.push(v);
    }
  }
  return out;
}
function tensesForDrill(d){
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  return ['pres','estar','ir','pps'].filter(t=>{
    if(t==='pps' && !v.pps) return false;
    if(d.inf==='estar' && (t==='estar'||t==='ir')) return false;
    if(!d.cont && t==='estar') return false;
    return true;
  });
}
function startVerbDay(){
  const d = verbOfDay();
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  const tenses = tensesForDrill(d);
  const steps = [];
  tenses.forEach(t=>{
    const ps = shuffle([0,1,2,3,4]).slice(0, t==='pres'?5:3);
    ps.forEach(p=>{
      const pt = ptPhrase(d,t,p); if(!pt) return;
      steps.push({t, p, ru: ruPhrase(d,t,p), pt});
    });
  });
  SES = {queue: steps.map(s=>{ const q = ({
      p:{id:'vd-'+d.inf+'-'+s.t+'-'+s.p, kind:'trans', unit:d.unit, group:'trans',
         rule: s.t==='pres'?'pres_regulares':s.t==='estar'?'estar_a':s.t==='ir'?'ir_inf':'pps_regulares'},
      id:'vd-'+d.inf+'-'+s.t+'-'+s.p,
      type:'input', big:true,
      label:`Глагол дня: ${d.inf} · ${TENSES[s.t].name}`,
      prompt: s.ru, answers: ptVariants(s.pt),
      speakAfter: s.pt,
      rule: s.t==='pres'?'pres_regulares':s.t==='estar'?'estar_a':s.t==='ir'?'ir_inf':'pps_regulares',
      conj:{v, tense:s.t, person:s.p}
    }); q.p._pre = q; return q; }), i:0, right:0, wrong:0, again:[], log:[], title:'Глагол дня'};
  renderSession();
}

let dictRec = null, dictActive = false, dictBtnEl = null, dictAccum = '';
function toggleDictation(inp, btn){
  if(dictActive){ stopDictation(); return; }
  speechSynthesis.cancel();
  dictRec = new SR();
  dictRec.lang = 'pt-PT'; dictRec.interimResults = true; dictRec.continuous = true;

      dictAccum = inp.value;                       // не теряем сказанное при перезапуске
      try{ dictRec.start(); return; }catch(err){}
    }
    stopDictation();
  };
  dictRec.start();
  inp.focus();
}

  dictActive = false;
  if(dictRec){ dictRec.onend = null; try{ dictRec.stop(); }catch(e){} dictRec = null; }

}

function toggleRec(s){
  if(recActive){ userStopRec(); return; }
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'pt-PT'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 3;
  const mic = document.getElementById('mic'), st = document.getElementById('micState');
  const deadline = Date.now() + 15000;          // слушаем до 15 секунд
  let accumulated = '', interim = '';
  recActive = true;
  const remain = ()=> Math.max(0, Math.ceil((deadline-Date.now())/1000));
  const timer = setInterval(()=>{
    if(!recActive){ clearInterval(timer); return; }
    if(Date.now() >= deadline){ clearInterval(timer); userStopRec(); }
    else if(st && !interim && !accumulated) st.textContent = `слушаю… ${remain()} с · нажмите ещё раз, когда закончите`;
  }, 500);
  rec._finalize = ()=>{
    clearInterval(timer);
    const text = (accumulated + ' ' + interim).trim();
    resetMic();
    if(text) judgeDialog(s, text);
    else if(st) st.textContent = 'ничего не расслышала — попробуйте ещё раз';
  };
  rec.onstart = ()=>{ mic.style.background='var(--warn)'; mic.textContent='◼';
    st.textContent = `слушаю… ${remain()} с · нажмите ещё раз, когда закончите`; };
  rec.onresult = e=>{
    accumulated = ''; interim = '';
    for(const r of e.results){
      if(r.isFinal) accumulated += r[0].transcript + ' ';
      else interim += r[0].transcript + ' ';
    }
    st.textContent = '«'+(accumulated+interim).trim()+'»';
  };
  rec.onerror = e=>{
    if(e.error==='no-speech') return;           // тишина — просто ждём дальше
    recActive=false; clearInterval(timer); resetMic();
    st.textContent = e.error==='not-allowed' ? 'нет доступа к микрофону — разрешите в настройках браузера' : 'ошибка: '+e.error;
  };
  rec.onend = ()=>{
    if(recActive && Date.now() < deadline){
      try{ rec.start(); return; }catch(err){}   // браузер сам закрыл на паузе — продолжаем слушать
    }
    if(recActive){ recActive=false; const f=rec._finalize; rec._finalize=null; if(f) f(); }
  };
  rec.start();
}
function userStopRec(){
  if(!recActive) return;
  recActive = false;
  const r = rec, f = r._finalize;
  r._finalize = null;
  try{ r.stop(); }catch(e){}
  if(f) f();
}
function stopRec(){ if(rec){ rec._finalize=null; rec.onend=null; try{rec.stop();}catch(e){} } recActive=false; resetMic(); }
function resetMic(){ const m=document.getElementById('mic'); if(m){ m.style.background='var(--accent)'; m.textContent='🎤'; } }

function judgeDialog(s, text){
  stopRec();
  if(!text || !text.trim()) return;
  const t = strip(text.toLowerCase());
  const missing = [];
  for(const group of s.keys){
    if(!group.some(k => t.includes(strip(k.toLowerCase())))) missing.push(group[0]);
  }
  // структура: фраза должна быть похожа на один из образцов, а не просто содержать слова
  const models = [s.model, ...(s.models||[])];
  let bestSim = 0, bestModel = s.model;
  for(const m of models){ const v = sim(text, m); if(v > bestSim){ bestSim = v; bestModel = m; } }
  const grammarOk = bestSim >= 0.55;
  const ok = missing.length === 0 && grammarOk;
  DLG.tries++;
  const firstTry = !DLG.answers.some(a=>a.step===DLG.i);
  DLG.answers.push({step:DLG.i, task:s.task, given:text, ok, model:s.model,
                    models:s.models||[], missing, firstTry});
  const v = document.getElementById('verdict');
  const variants = m => m && m.length ?
    `<div class="ru" style="margin-top:6px">ещё можно сказать:<br>${m.map(x=>'· '+esc(x)).join('<br>')}</div>` : '';
  if(ok){
    DLG.ok++;
    v.innerHTML = `<div class="verdict ok"><div class="big">✓ Отлично!</div>
      <div class="ru">вы сказали: «${esc(text)}»</div>
      <div class="ru">образец: ${esc(s.model)}</div>${variants(s.models)}</div>
      <button class="btn wide" id="next" style="margin-top:12px">Дальше →</button>`;
    say(s.model);
    document.getElementById('next').onclick = ()=>{ DLG.i++; renderDialogStep(); };
  }else{
    const d = wordDiff(text, bestModel);
    const head = missing.length
      ? `Не хватает: ${missing.map(esc).join(', ')}`
      : `Слова есть, но фраза построена неверно`;
    v.innerHTML = `<div class="verdict no"><div class="big">${head}</div>
      <div class="ru" style="font-size:15px;margin-top:6px">вы: ${d.givenHtml}</div>
      <div class="ru">образец: <span class="diff" style="font-weight:600;color:var(--ink)">${d.targetHtml}</span></div>
      ${variants(s.models)}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="retry">Попробовать ещё раз</button>
        <button class="btn ghost" id="skipD">Пропустить</button>
      </div>`;
    document.getElementById('retry').onclick = ()=> renderDialogStep();
    document.getElementById('skipD').onclick = ()=>{ DLG.i++; renderDialogStep(); };
  }
}
function finishDialog(){
  const d = DLG.d;
  S.hist['dlg-'+d.id] = (S.hist['dlg-'+d.id]||0)+1;
  // статистика: по каждому шагу — первая попытка, ошибки
  const firstOk = d.steps.map((_,i)=>{
    const a = DLG.answers.find(x=>x.step===i && x.firstTry);
    return a ? (a.ok?1:0) : 0;
  });
  S.dlg = S.dlg || {};
  const rec = S.dlg[d.id] = S.dlg[d.id] || {runs:0, steps:d.steps.length, hist:[]};
  rec.runs++; rec.hist.push({d:today(), ok:firstOk.reduce((a,b)=>a+b,0)});
  if(rec.hist.length>20) rec.hist = rec.hist.slice(-20);
  const dd = today(); S.hist[dd] = S.hist[dd]||{n:0,ok:0};
  S.hist[dd].n += d.steps.length; S.hist[dd].ok += firstOk.reduce((a,b)=>a+b,0);
  save();
  // разбор: все шаги, где первая попытка была неудачной или шаг пропущен
  const problems = [];
  d.steps.forEach((st,i)=>{
    const tries = DLG.answers.filter(a=>a.step===i);
    const first = tries.find(a=>a.firstTry);
    const solved = tries.some(a=>a.ok);
    if(!first || !first.ok || !solved){
      problems.push({st, first, solved});
    }
  });
  const nOk = firstOk.reduce((a,b)=>a+b,0);
  let review = '';
  if(problems.length){
    review = `<div class="card"><h2>Разбор · ${problems.length} ${plural(problems.length,'реплика','реплики','реплик')}</h2>` +
      problems.map(p=>`<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)">
        <div class="small muted">${esc(p.st.task)}</div>
        ${p.first && p.first.given ? `<div style="color:var(--warn)">✗ «${esc(p.first.given)}»
           <span class="small muted">${p.first.missing.length? '— не хватило: '+p.first.missing.map(esc).join(', ') : '— фраза построена неверно'}</span></div>`
          : `<div class="small muted">— пропущено —</div>`}
        <div style="color:var(--accent);font-weight:600">✓ ${esc(p.st.model)}
          <button class="speak" data-s="${esc(p.st.model)}">🔊</button></div>
        ${(p.st.models||[]).length? `<div class="small muted">также: ${p.st.models.map(esc).join(' · ')}</div>`:''}
      </div>`).join('') + `</div>`;
  }
  document.getElementById('view').innerHTML = review + `
   <div class="card done-hero">
     <div class="em">${nOk===d.steps.length?'🎉':'🗣'}</div>
     <h3>Диалог пройден</h3>
     <p class="muted">${nOk} из ${d.steps.length} реплик принято с первой попытки</p>
     <p class="small muted">пройден ${rec.runs} ${plural(rec.runs,'раз','раза','раз')}${rec.hist.length>1?
       ' · прошлые: '+rec.hist.slice(-5,-1).map(h=>h.ok+'/'+rec.steps).join(', '):''}</p>
     <div class="row" style="justify-content:center;margin-top:16px">
       <button class="btn" id="again">Ещё раз</button>
       <button class="btn ghost" id="list">Другие диалоги</button>
       <button class="btn ghost" id="home3">На главную</button>
     </div>
   </div>`;
  document.querySelectorAll('.speak[data-s]').forEach(b=> b.onclick=()=>say(b.dataset.s));
  document.getElementById('again').onclick = ()=> startDialog(d);
  document.getElementById('list').onclick = dialogsList;
  document.getElementById('home3').onclick = home;
  DLG = null;
}

/* ---------- экраны ---------- */
function counts(){
  buildPool();
  const due = POOL.filter(p=>isDue(p.id)).length;
  const learned = POOL.filter(p=>S.items[p.id] && S.items[p.id].b>=3).length;
  const started = POOL.filter(p=>S.items[p.id]).length;
  return {due, learned, started, total:POOL.length};
}
function chips(){
  const c = counts();
  document.getElementById('streakChip').innerHTML = `🔥 <b>${S.streak}</b>`;
  document.getElementById('dueChip').innerHTML = `к повтору <b>${c.due}</b>`;
  return c;
}
function home(){
  const c = chips();
  const doneToday = (S.hist[today()]||{}).n || 0;
  const pct = c.total ? Math.round(c.learned/c.total*100) : 0;
  const vd = verbOfDay();
  const st = storyOfDay();
  const dn = lessonNum();
  const dlg = DATA.dialogs[dn % DATA.dialogs.length];
  const todayUnits = new Set([vd.unit, st.unit, dlg.unit]);
  const doneKey = k => (S.hist['done-'+k]===today());
  const mark = k => doneKey(k) ? ' ✓' : '';
  document.getElementById('view').innerHTML = `
  <div class="card">
    <h2>Урок на сегодня</h2>
    <p class="small muted" style="margin-top:-6px">
      ${c.due ? `${c.due} ${plural(c.due,'карточка','карточки','карточек')} к повторению` : 'повторять пока нечего'}
      ${doneToday?` · сегодня ${doneToday} ${plural(doneToday,'ответ','ответа','ответов')}`:''}
    </p>
    <div class="opts" style="margin-top:8px">
      <button class="opt" id="lsVerb"><span class="k">1</span>
        <span><b>Глагол дня: ${vd.inf}</b>${mark('verb')}<br>
        <span class="small muted">одна фраза во всех лицах · ${tensesForDrill(vd).map(t=>TENSES[t].name).join(' · ')}</span></span></button>
      <button class="opt" id="lsMain"><span class="k">2</span>
        <span><b>Тренировка · ${S.set.len} заданий</b>${mark('main')}<br>
        <span class="small muted">повторения + спряжения, предлоги, артикли, перевод</span></span></button>
      <button class="opt" id="lsStory"><span class="k">3</span>
        <span><b>История: ${esc(st.title)}</b>${mark('story')}<br>
        <span class="small muted">соберите рассказ из ${st.phrases.length} фраз · юнит ${st.unit}</span></span></button>
      <button class="opt" id="lsDlg"><span class="k">4</span>
        <span><b>Диалог: ${dlg.icon} ${esc(dlg.title)}</b>${mark('dlg')}<br>
        <span class="small muted">говорите вслух в микрофон</span></span></button>
    </div>
    ${['verb','main','story','dlg'].every(doneKey)
      ? `<button class="btn wide" id="finishLesson" style="margin-top:12px">✅ Завершить урок · открыть следующий</button>`
      : `<button class="btn ghost wide" id="finishLesson" style="margin-top:12px">Пропустить этот урок → следующий</button>`}
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="small muted">освоено ${c.learned} из ${c.total} · в работе ${c.started}</div>
  </div>

  <div class="card">
    <h2>Отдельные блоки</h2>
    <div class="grid">
      <button class="mode" data-f="conj"><div class="t">Времена и спряжения</div>
        <div class="d">Presente · Estar a + Infinitivo · Ir + Infinitivo · PPS</div></button>
      <button class="mode" data-f="trans"><div class="t">Перевод с русского</div>
        <div class="d">фразы из учебника, ввод целиком</div></button>
      <button class="mode" data-f="prep"><div class="t">Предлоги и артикли</div>
        <div class="d">de/em · a/para/por · слияния do/na/pelo</div></button>
      <button class="mode" data-f="rules"><div class="t">Грамматика</div>
        <div class="d">ser/estar · императив · местоимения · há/desde</div></button>
      <button class="mode" data-f="vocab"><div class="t">Лексика и роды</div>
        <div class="d">${DATA.vocab.length} слов по темам учебника</div></button>
      <button class="mode" data-f="weak"><div class="t">Работа над ошибками</div>
        <div class="d">то, где чаще всего ошибаешься</div></button>
      <button class="mode" id="allDlg"><div class="t">🗣 Все диалоги</div>
        <div class="d">кафе, аптека, врач, рынок, магазин, касса…</div></button>
      <button class="mode" id="allStories"><div class="t">📖 Все истории</div>
        <div class="d">${DATA.stories.length} мини-рассказов по юнитам</div></button>
    </div>
  </div>

  <div class="card">
    <h2>Тренировка по юниту</h2>
    <div class="row">${[1,2,3,4,5,6,7,8].map(u=>{
      const hot = todayUnits.has(u);
      return `<button class="btn ghost${hot?' hot':''}" data-u="${u}" style="padding:9px 14px"
        ${hot?'title="в сегодняшнем уроке"':''}>${u}</button>`;}).join('')}</div>
    <div class="small muted" style="margin-top:10px">
      <span style="color:var(--warn)">красным</span> — юниты сегодняшнего урока ·
      ${DATA.unitNames.map((n,i)=>`${i+1}. ${esc(n)}`).join(' · ')}</div>
  </div>

  <div class="row">
    <button class="btn ghost" id="toRules">📘 Правила</button>
    <button class="btn ghost" id="toStats">📊 Статистика</button>
    <button class="btn ghost" id="toSet">⚙️ Настройки</button>
  </div>`;
  document.getElementById('finishLesson').onclick = ()=>{
    S.lessonOffset = (S.lessonOffset||0) + 1;
    ['verb','main','story','dlg'].forEach(k=> delete S.hist['done-'+k]);
    save(); home();
  };
  document.getElementById('lsVerb').onclick = ()=>{ S.hist['done-verb']=today(); save(); startVerbDay(); };
  document.getElementById('lsMain').onclick = ()=>{ S.hist['done-main']=today(); save(); startSession(null); };
  document.getElementById('lsStory').onclick = ()=>{ S.hist['done-story']=today(); save(); startStory(st); };
  document.getElementById('lsDlg').onclick = ()=>{ S.hist['done-dlg']=today(); save(); startDialog(dlg); };
  document.getElementById('allDlg').onclick = dialogsList;
  document.getElementById('allStories').onclick = storiesList;
  document.querySelectorAll('[data-f]').forEach(b=> b.onclick = ()=>{
    const f = b.dataset.f;
    const RULEGRP = p => p.group==='rules';
    const PREP = p => p.rule && ['de_em_paises','prep_tempo','prep_movimento','para_por','em_meses','transportes','contracoes','lugar','prep_pronome','com_pronome','artigos'].includes(p.rule);
    const map = {
      conj: p=>p.kind==='conj',
      trans: p=>p.kind==='trans',
      prep: p=> PREP(p) || p.kind==='gender',
      rules: p=> RULEGRP(p) && !PREP(p),
      vocab: p=>p.group==='vocab',
      weak: p=> S.items[p.id] && S.items[p.id].w>0
    };
    startSession(map[f], b.querySelector('.t').textContent);
  });
  document.querySelectorAll('[data-u]').forEach(b=> b.onclick = ()=>
    startSession(p=>p.unit===+b.dataset.u, 'Юнит '+b.dataset.u));
  document.getElementById('toRules').onclick = rulesView;
  document.getElementById('toStats').onclick = statsView;
  document.getElementById('toSet').onclick = setView;
  document.onkeydown = null;
}

function storiesList(){
  document.getElementById('view').innerHTML = `
   <div class="row" style="margin-bottom:14px"><button class="btn ghost" id="back">← назад</button></div>
   <div class="card"><h2>Истории</h2>
     <p class="small muted" style="margin-top:-6px">Соберите рассказ: каждая фраза переводится с русского, в конце — весь текст с озвучкой.</p>
     <div class="grid">${DATA.stories.map((s,i)=>`
       <button class="mode" data-s="${i}"><div class="t">${esc(s.title)}</div>
         <div class="d">юнит ${s.unit} · ${s.phrases.length} фраз</div></button>`).join('')}</div>
   </div>`;
  document.getElementById('back').onclick = home;
  document.querySelectorAll('[data-s]').forEach(b=> b.onclick = ()=> startStory(DATA.stories[+b.dataset.s]));
}

function rulesView(){
  const byUnit = {};
  DATA.rules.forEach(r=> (byUnit[r.unit] = byUnit[r.unit]||[]).push(r));
  let html = `<div class="row" style="margin-bottom:14px"><button class="btn ghost" id="back">← назад</button></div>`;
  Object.keys(byUnit).sort().forEach(u=>{
    html += `<h2 style="margin:18px 0 8px">Юнит ${u} · ${esc(DATA.unitNames[u-1])}</h2>`;
    byUnit[u].forEach(r=>{
      html += `<details class="rule"><summary><span class="tag">${esc(r.id.split('_')[0])}</span>${esc(r.title)}</summary>
        <div class="body">${r.body}<div class="ex">${
          r.ex.map(e=>`<div><div class="p">${esc(e[0])} <button class="speak" data-s="${esc(e[0])}">🔊</button></div><div class="r">${esc(e[1])}</div></div>`).join('')
        }</div></div></details>`;
    });
  });
  document.getElementById('view').innerHTML = html;
  document.getElementById('back').onclick = home;
  document.querySelectorAll('.speak[data-s]').forEach(b=> b.onclick = e=>{ e.preventDefault(); say(b.dataset.s); });
}

function statsView(){
  buildPool();
  const byRule = {};
  POOL.forEach(p=>{
    const m = S.items[p.id]; if(!m) return;
    const k = p.rule || p.theme || p.group;
    byRule[k] = byRule[k] || {r:0,w:0};
    byRule[k].r += m.r; byRule[k].w += m.w;
  });
  const rows = Object.entries(byRule).filter(([,v])=>v.r+v.w>0)
    .sort((a,b)=> (a[1].r/(a[1].r+a[1].w)) - (b[1].r/(b[1].r+b[1].w)));
  const days = Object.keys(S.hist).sort().slice(-14);
  const title = k => (DATA.rules.find(r=>r.id===k)||{}).title || k;
  document.getElementById('view').innerHTML = `
   <div class="row" style="margin-bottom:14px"><button class="btn ghost" id="back">← назад</button></div>
   <div class="card"><h2>Последние 14 дней</h2>
     <div style="display:flex;gap:4px;align-items:flex-end;height:70px">
       ${days.length? days.map(d=>{const h=S.hist[d];const acc=h.n?h.ok/h.n:0;
         return `<div title="${d}: ${h.ok}/${h.n}" style="flex:1;background:var(--accent);opacity:${.35+acc*.65};
                 height:${Math.max(6,Math.min(70,h.n*3))}px;border-radius:4px"></div>`;}).join('')
         : '<div class="small muted">пока нет данных</div>'}
     </div>
   </div>
   <div class="card"><h2>Где чаще ошибки</h2>
     ${rows.length? rows.slice(0,14).map(([k,v])=>{
        const acc = Math.round(v.r/(v.r+v.w)*100);
        return `<div class="statline"><span>${esc(title(k))}</span>
          <span class="mini"><i style="width:${acc}%"></i></span>
          <span class="n">${acc}% · ${v.r+v.w}</span></div>`;}).join('')
       : '<div class="small muted">Ответьте на несколько заданий — здесь появится разбор по темам.</div>'}
   </div>
   <div class="card"><h2>Диалоги</h2>
     ${S.dlg && Object.keys(S.dlg).length ? Object.entries(S.dlg).map(([id,r])=>{
        const d = DATA.dialogs.find(x=>x.id===id); if(!d) return '';
        const last = r.hist[r.hist.length-1];
        const acc = Math.round(last.ok/r.steps*100);
        return `<div class="statline"><span>${d.icon} ${esc(d.title)}</span>
          <span class="mini"><i style="width:${acc}%"></i></span>
          <span class="n">${last.ok}/${r.steps} · ×${r.runs}</span></div>`;}).join('')
       : '<div class="small muted">Пройдите диалог — здесь появятся результаты.</div>'}
   </div>
   <div class="card"><h2>Сброс</h2>
     <button class="btn ghost" id="reset">Сбросить весь прогресс</button></div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('reset').onclick = ()=>{
    if(confirm('Удалить весь прогресс и начать заново?')){ localStorage.removeItem(KEY); S=load(); home(); } };
}

function setView(){
  const s = S.set;
  document.getElementById('view').innerHTML = `
   <div class="row" style="margin-bottom:14px"><button class="btn ghost" id="back">← назад</button></div>
   <div class="card"><h2>Настройки</h2>
     <label class="set">Заданий в сессии
       <select id="len">${[10,15,20,25,30,40].map(n=>`<option ${n===s.len?'selected':''}>${n}</option>`).join('')}</select></label>
     <label class="set">Новых карточек в день
       <select id="np">${[5,10,15,20,30].map(n=>`<option ${n===s.newPerDay?'selected':''}>${n}</option>`).join('')}</select></label>
     <label class="set">Строгая проверка диакритики
       <input type="checkbox" id="strict" ${s.strict?'checked':''}></label>
     <label class="set">Озвучка (pt-PT)
       <input type="checkbox" id="speak" ${s.speak?'checked':''}></label>
   </div>
   <div class="card"><h2>Юниты в работе</h2>
     <div class="row">${[1,2,3,4,5,6,7,8].map(u=>
       `<button class="btn ${s.units.includes(u)?'':'ghost'}" data-u="${u}" style="padding:9px 15px">${u}</button>`).join('')}</div>
     <div class="small muted" style="margin-top:10px">Выключенные юниты не попадают ни в сессию, ни в счётчики.</div>
   </div>
   <div class="card"><h2>Состав ежедневной сессии</h2>
     ${[['conj','Времена и спряжения'],['trans','Перевод с русского'],['rules','Грамматика и предлоги'],['vocab','Лексика']]
       .map(([k,n])=>`<label class="set">${n}
         <input type="range" min="0" max="60" step="5" value="${s.focus[k]}" data-focus="${k}" style="width:130px">
         <span class="small muted" id="f-${k}" style="width:38px;text-align:right">${s.focus[k]}%</span></label>`).join('')}
     <div class="small muted">Доли применяются к новым карточкам; всё, что пора повторить, идёт в сессию в любом случае.</div>
   </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('len').onchange = e=>{ s.len=+e.target.value; save(); };
  document.getElementById('np').onchange = e=>{ s.newPerDay=+e.target.value; save(); };
  document.getElementById('strict').onchange = e=>{ s.strict=e.target.checked; save(); };
  document.getElementById('speak').onchange = e=>{ s.speak=e.target.checked; save(); };
  document.querySelectorAll('[data-u]').forEach(b=> b.onclick = ()=>{
    const u=+b.dataset.u;
    s.units = s.units.includes(u) ? s.units.filter(x=>x!==u) : [...s.units,u].sort();
    if(!s.units.length) s.units=[u];
    save(); setView(); });
  document.querySelectorAll('[data-focus]').forEach(r=> r.oninput = ()=>{
    s.focus[r.dataset.focus] = +r.value;
    document.getElementById('f-'+r.dataset.focus).textContent = r.value+'%'; save(); });
}

/* ---------- старт ---------- */
buildPool();
home();

</script>
</body>
</html>
