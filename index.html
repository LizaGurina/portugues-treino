function toggleRec(s){
  if(recActive){ userStopRec(); return; }
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'pt-PT'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 3;
  const mic = document.getElementById('mic'), st = document.getElementById('micState');
  const deadline = Date.now() + 15000;          // слушаем до 15 секунд
  let accumulated = '', interim = '';
  recActive = true;
  const remain = ()=> Math.max(0, Math.ceil((deadline-Date.now())/1000));
  const timer = setInterval(()=>{
    if(!recActive){ clearInterval(timer); return; }
    if(Date.now() >= deadline){ clearInterval(timer); userStopRec(); }
    else if(st && !interim && !accumulated) st.textContent = `слушаю… ${remain()} с · нажмите ещё раз, когда закончите`;
  }, 500);
  rec._finalize = ()=>{
    clearInterval(timer);
    const text = (accumulated + ' ' + interim).trim();
    resetMic();
    if(text) judgeDialog(s, text);
    else if(st) st.textContent = 'ничего не расслышала — попробуйте ещё раз';
  };
  rec.onstart = ()=>{ mic.style.background='var(--warn)'; mic.textContent='◼';
    st.textContent = `слушаю… ${remain()} с · нажмите ещё раз, когда закончите`; };
  rec.onresult = e=>{
    accumulated = ''; interim = '';
    for(const r of e.results){
      if(r.isFinal) accumulated += r[0].transcript + ' ';
      else interim += r[0].transcript + ' ';
    }
    const heard = (accumulated+interim).trim();
    if(DLG) DLG.lastHeard = heard;
    st.textContent = '«'+heard+'»';
  };
  rec.onerror = e=>{
    if(e.error==='no-speech') return;           // тишина — просто ждём дальше
    recActive=false; clearInterval(timer); resetMic();
    st.textContent = e.error==='not-allowed' ? 'нет доступа к микрофону — разрешите в настройках браузера' : 'ошибка: '+e.error;
  };
  rec.onend = ()=>{
    if(recActive && Date.now() < deadline){
      try{ rec.start(); return; }catch(err){}   // браузер сам закрыл на паузе — продолжаем слушать
    }
    if(recActive){ recActive=false; const f=rec._finalize; rec._finalize=null; if(f) f(); }
  };
  rec.start();
}
function userStopRec(){
  if(!recActive) return;
  recActive = false;
  const r = rec, f = r._finalize;
  r._finalize = null;
  try{ r.stop(); }catch(e){}
  if(f) f();
}
function stopRec(){ if(rec){ rec._finalize=null; rec.onend=null; try{rec.stop();}catch(e){} } recActive=false; resetMic(); }
function resetMic(){ const m=document.getElementById('mic'); if(m){ m.style.background='var(--accent)'; m.textContent='🎤'; } }

function judgeDialog(s, text){
  stopRec();
  if(!text || !text.trim()) return;
  const t = strip(text.toLowerCase());
  const missing = [];
  for(const group of s.keys){
    if(!group.some(k => t.includes(strip(k.toLowerCase())))) missing.push(group[0]);
  }
  // структура: фраза должна быть похожа на один из образцов, а не просто содержать слова
  const models = [s.model, ...(s.models||[])];
  let bestSim = 0, bestModel = s.model;
  for(const m of models){ const v = sim(text, m); if(v > bestSim){ bestSim = v; bestModel = m; } }
  const grammarOk = bestSim >= 0.55;
  const borderline = missing.length === 0 && !grammarOk && bestSim >= 0.38;
  const ok = missing.length === 0 && (grammarOk || borderline);
  DLG.tries++;
  const firstTry = !DLG.answers.some(a=>a.step===DLG.i);
  DLG.answers.push({step:DLG.i, task:s.task, given:text, ok, model:s.model, bestModel,
                    models:s.models||[], missing, firstTry, borderline});
  const v = document.getElementById('verdict');
  const variants = m => m && m.length ?
    `<div class="ru" style="margin-top:6px">ещё можно сказать:<br>${m.map(x=>'· '+esc(x)).join('<br>')}</div>` : '';
  if(ok){
    DLG.ok++;
    const d0 = borderline ? wordDiff(text, bestModel) : null;
    v.innerHTML = `<div class="verdict ok"><div class="big">${borderline?'✓ Принято — но сверься с образцом':'✓ Отлично!'}</div>
      <div class="ru">вы сказали: ${borderline? d0.givenHtml : '«'+esc(text)+'»'}</div>
      <div class="ru">образец: ${borderline? `<span class="diff">${d0.targetHtml}</span>` : esc(s.model)}</div>${variants(s.models)}</div>
      <button class="btn wide" id="next" style="margin-top:12px">Дальше →</button>`;
    say(s.model);
    document.getElementById('next').onclick = ()=>{ DLG.i++; renderDialogStep(); };
    if(typeof aiDialogVerify==='function') aiDialogVerify(s, text);
  }else{
    const d = wordDiff(text, bestModel);
    const head = missing.length
      ? `Не хватает: ${missing.map(esc).join(', ')}`
      : `Слова есть, но фраза построена неверно`;
    v.innerHTML = `<div class="verdict no"><div class="big">${head}</div>
      <div class="ru" style="font-size:15px;margin-top:6px">вы: ${d.givenHtml}</div>
      <div class="ru">образец: <span class="diff" style="font-weight:600;color:var(--ink)">${d.targetHtml}</span></div>
      ${variants(s.models)}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="retry">Попробовать ещё раз</button>
        <button class="btn ghost" id="skipD">Пропустить</button>
      </div>`;
    document.getElementById('retry').onclick = ()=> renderDialogStep();
    document.getElementById('skipD').onclick = ()=>{ DLG.i++; renderDialogStep(); };
    if(typeof aiDialogOpinion==='function') aiDialogOpinion(s, text, ()=>{
      DLG.ok++;
      const a = DLG.answers.slice(-1)[0];
      if(a){ a.ok = true; a.aiAccepted = true; }
      DLG.i++; renderDialogStep();
    });
  }
}
function finishDialog(){
  const d = DLG.d;
  S.hist['dlg-'+d.id] = (S.hist['dlg-'+d.id]||0)+1;
  // статистика: по каждому шагу — первая попытка, ошибки
  const firstOk = d.steps.map((_,i)=>{
    const a = DLG.answers.find(x=>x.step===i && x.firstTry);
    return a ? (a.ok?1:0) : 0;
  });
  S.dlg = S.dlg || {};
  const rec = S.dlg[d.id] = S.dlg[d.id] || {runs:0, steps:d.steps.length, hist:[]};
  rec.runs++; rec.hist.push({d:today(), ok:firstOk.reduce((a,b)=>a+b,0)});
  if(rec.hist.length>20) rec.hist = rec.hist.slice(-20);
  const dd = today(); S.hist[dd] = S.hist[dd]||{n:0,ok:0};
  S.hist[dd].n += d.steps.length; S.hist[dd].ok += firstOk.reduce((a,b)=>a+b,0);
  save();
  // все реплики: что сказала, с подсветкой ошибочных мест
  const rows = [];
  d.steps.forEach((st,i)=>{
    const tries = DLG.answers.filter(a=>a.step===i);
    if(!tries.length){
      rows.push(`<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)">
        <div class="small muted">${esc(st.task)}</div>
        <div class="small muted">— пропущено —</div>
        <div style="color:var(--accent);font-weight:600">✓ ${esc(st.model)}
          <button class="speak" data-s="${esc(st.model)}">🔊</button></div></div>`);
      return;
    }
    const final = tries.filter(a=>a.ok).slice(-1)[0] || tries.slice(-1)[0];
    const dd = wordDiff(final.given, final.bestModel || st.model);
    const attempts = tries.length>1 ? ` <span class="small muted">· с ${tries.length}-й попытки</span>` : '';
    let firstFail = '';
    const f0 = tries[0];
    if(tries.length>1 && !f0.ok && f0.given){
      const d0 = wordDiff(f0.given, f0.bestModel || st.model);
      firstFail = `<div class="small" style="color:var(--warn)">✗ 1-я попытка: ${d0.givenHtml}</div>`;
    }
    const failNote = !final.ok
      ? `<div class="small muted">${final.missing.length? 'не хватило: '+final.missing.map(esc).join(', ') : 'фраза построена неверно'}</div>` : '';
    rows.push(`<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)">
      <div class="small muted">${esc(st.task)}</div>
      ${firstFail}
      <div style="color:${final.ok?'var(--ink)':'var(--warn)'}">${final.ok?'✓':'✗'} ${dd.givenHtml}${attempts}</div>
      ${failNote}
      <div class="small" style="color:var(--accent)">образец: <span class="diff">${dd.targetHtml}</span>
        <button class="speak" data-s="${esc(final.bestModel || st.model)}">🔊</button></div>
    </div>`);
  });
  const nOk = firstOk.reduce((a,b)=>a+b,0);
  const review = `<div class="card"><h2>Ваши реплики</h2>${rows.join('')}</div>`;
  document.getElementById('view').innerHTML = review + `
   <div class="card done-hero">
     <div class="em">${nOk===d.steps.length?'🎉':'🗣'}</div>
     <h3>Диалог пройден</h3>
     <p class="muted">${nOk} из ${d.steps.length} реплик принято с первой попытки</p>
     <p class="small muted">пройден ${rec.runs} ${plural(rec.runs,'раз','раза','раз')}${rec.hist.length>1?
       ' · прошлые: '+rec.hist.slice(-5,-1).map(h=>h.ok+'/'+rec.steps).join(', '):''}</p>
     <div class="row" style="justify-content:center;margin-top:16px">
       <button class="btn" id="again">Ещё раз</button>
       <button class="btn ghost" id="list">Другие диалоги</button>
       <button class="btn ghost" id="home3">На главную</button>
     </div>
   </div>`;
  document.querySelectorAll('.speak[data-s]').forEach(b=> b.onclick=()=>say(b.dataset.s));
  document.getElementById('again').onclick = ()=> startDialog(d);
  document.getElementById('list').onclick = dialogsList;
  document.getElementById('home3').onclick = home;
  DLG = null;
}

/* раздел одного глагола: pres | pps | peri */
function startVerbSection(d, mode){
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  const steps = [];
  if(mode==='peri'){
    const cands = PERIS.filter(pe =>
      pe.id.split(' ')[0] !== d.inf && (!pe.needCont || d.cont) &&
      (!pe.skill || SKILL_VERBS.has(d.inf)) && (!pe.usePres || d.ruPres) &&
      !(d.inf==='poder' && ['querer','conseguir','dever (obrigação moral)','queria (cortesia)'].includes(pe.id)) &&
      !(d.inf==='querer' && pe.id==='queria (cortesia)'));
    shuffle(cands).forEach(pe=>{
      const ps = pe.persons || [0,1,2,3,4];
      const p = ps[Math.floor(Math.random()*ps.length)];
      const q = periQuestion(d, v, pe, p);
      steps.push({label:`${d.inf} · связки`, hintLabel:`конструкция ${pe.id} + Infinitivo`,
                  ru:q.ru, pt:q.pt, answers:q.answers, rule:pe.rule});
    });
  }else if(d.full){
    const t = mode;
    shuffle([0,1,2,3,4]).forEach(p=>{
      const mk = t==='pps' ? rnd(PPS_MARKERS) : null;
      const pt = ptPhrase(d,t,p,mk); if(!pt) return;
      steps.push({label:`${d.inf} · ${TENSES[t].name}`, ru:ruPhrase(d,t,p,mk), pt,
                  answers:ptVariants(pt),
                  rule: t==='pres'?'pres_regulares':'pps_regulares',
                  conj:{v, tense:t, person:p}});
    });
  }else{
    // без полных фраз: карточки «лицо → форма» с красной подсказкой
    const t = mode;
    const SUBJ_LC = ['я','ты','она','мы','они'];
    const MKW = {pres:'обычно', pps:'вчера'};
    shuffle([0,1,2,3,4]).forEach(p=>{
      const form = conjForm(v, t, p); if(!form) return;
      const answers = [form];
      PERSONS[p].split(', ').forEach(pr=> answers.push(pr+' '+form));
      steps.push({label:`${d.inf} · ${TENSES[t].name}`, card:true,
        prompt:`${PERSONS[p]} — <span style="color:var(--accent)">${d.inf}</span>`,
        subHtml:`${esc(d.ruInf)} · <b style="color:var(--warn)">${TENSES[t].short} — ${MKW[t]} ${SUBJ_LC[p]}…</b>`,
        answers, pt:form,
        rule: t==='pres'?'pres_regulares':'pps_regulares',
        conj:{v, tense:t, person:p}});
    });
  }
  // ter / estar: состояния (fome, sede, frio, dores…) во всех временах раздела
  if((d.inf==='ter' || d.inf==='estar') && (mode==='pres' || mode==='pps')){
    stateQuestions(d.inf, mode, 5).forEach(sq=>{
      steps.push({label:`${d.inf} · состояния (ter / estar com)`, ru:sq.ru, pt:sq.pt,
                  answers:sq.answers, rule:sq.rule});
    });
  }
  // возвратный близнец: в Presente подмешиваем chamo-me / vestes-te / …
  if(mode==='pres'){
    const twin = DATA.verbs.find(x=>x.inf===d.inf+'-se');
    if(twin){
      const SUBJ_LC = ['я','ты','она','мы','они'];
      shuffle([0,1,2,3,4]).slice(0,3).forEach(p=>{
        const form = conjForm(twin, 'pres', p); if(!form) return;
        const answers = [form];
        PERSONS[p].split(', ').forEach(pr=> answers.push(pr+' '+form));
        steps.push({label:`${d.inf} · возвратная форма (-se)`, card:true,
          prompt:`${PERSONS[p]} — <span style="color:var(--accent)">${twin.inf}</span>`,
          subHtml:`${esc(twin.ru)} · <b style="color:var(--warn)">Presente — обычно ${SUBJ_LC[p]}… (себя)</b>`,
          answers, pt:form, rule:'reflexos',
          conj:{v:twin, tense:'pres', person:p}});
      });
    }
  }
  SES = {queue: shuffle(steps).map((s,i)=>({
      id:'vs-'+d.inf+'-'+mode+'-'+i, p:{id:'vs-'+d.inf+'-'+mode+'-'+i, kind:'trans', unit:d.unit},
      type:'input', big:!s.card, label:s.label,
      hintLabel: s.hintLabel||null,
      prompt: s.card ? s.prompt : s.ru,
      subHtml: s.subHtml||null,
      answers:s.answers, speakAfter:s.pt, rule:s.rule, conj:s.conj||null
    })), i:0, right:0, wrong:0, again:[], log:[],
    title: d.inf+' · '+(mode==='peri'?'связки':mode==='pres'?'Presente':'PPS')};
  renderSession();
}

/* ⚡ PPS-разминка: ser / ir / estar / ter — полными фразами */
const PPS4 = {
 ser: {objs:[{pt:['muito simpática','muito simpático'], ru:['очень любезна','очень любезен (любезна)','очень любезна','очень любезны','очень любезны'], plPt:['muito simpáticas','muito simpáticos']}],
       ruV:['была','был(а)','была','были','были']},
 ir:  {objs:[{pt:'ao cinema', ru:'в кино', v:'ход'}, {pt:'à praia', ru:'на пляж', v:'ход'},
             {pt:'ao mercado', ru:'на рынок', v:'ход'}, {pt:'ao Porto', ru:'в Порту', v:'езд'}],
       ruV:['ила','ил(а)','ила','или','или']},
 estar:{objs:[{pt:'em casa', ru:'дома'}, {pt:'na praia', ru:'на пляже'},
              {pt:'no hospital', ru:'в больнице'}, {pt:'em Lisboa', ru:'в Лиссабоне'}],
       ruV:['была','был(а)','была','были','были']},
 ter: {objs:[{pt:'aula de português', ru:'урок португальского', was:'был'},
             {pt:'febre', ru:'температура', was:'была'},
             {pt:'muito trabalho', ru:'много работы', was:'было'},
             {pt:'uma reunião', ru:'встреча', was:'была'}]},
};
function startPps4(){
  const RU_U2 = ['у меня','у тебя','у неё','у нас','у них'];
  const qs = [];
  ['ser','ir','estar','ter'].forEach(inf=>{
    const v = DATA.verbs.find(x=>x.inf===inf);
    const cfg = PPS4[inf];
    shuffle([0,1,2,3,4]).slice(0,3).forEach(p=>{
      const form = v.pps[p];
      const subj = DATA.subjPt[p], subjRu = DATA.subjRu[p];
      const mk = rnd(PPS_MARKERS.filter(m=>!m.pos));
      const o = rnd(cfg.objs);
      let ru, full, full2=null;
      if(inf==='ser'){
        const adj = (p>=3? o.plPt : o.pt);
        ru = `${mk.ru} ${subjRu.toLowerCase()} ${['была','был(а)','была','были','были'][p]} ${o.ru[p]}.`;
        full = `${mk.pt}, ${subj.toLowerCase()} ${form} ${adj[0]}.`;
        full2 = `${mk.pt}, ${subj.toLowerCase()} ${form} ${adj[1]}.`;
      }else if(inf==='ir'){
        ru = `${mk.ru} ${subjRu.toLowerCase()} ${o.v}${cfg.ruV[p]} ${o.ru}.`;
        full = `${mk.pt}, ${subj.toLowerCase()} ${form} ${o.pt}.`;
      }else if(inf==='estar'){
        ru = `${mk.ru} ${subjRu.toLowerCase()} ${cfg.ruV[p]} ${o.ru}.`;
        full = `${mk.pt}, ${subj.toLowerCase()} ${form} ${o.pt}.`;
      }else{
        ru = `${mk.ru} ${RU_U2[p]} ${o.was} ${o.ru}.`;
        full = `${mk.pt}, ${subj.toLowerCase()} ${form} ${o.pt}.`;
      }
      const answers = [];
      [full, full2].filter(Boolean).forEach(f=>{
        answers.push(...ptVariants(f));
        answers.push(f.replace(/^[^,]+, /,''));
      });
      answers.push(form);
      PERSONS[p].split(', ').forEach(pr=> answers.push(pr+' '+form));
      qs.push({
        id:'pps4-'+inf+'-'+p, p:{id:'pps4-'+inf+'-'+p, kind:'conj', unit:8, group:'conj'},
        type:'input', big:true, label:TENSES.pps.name,
        hintLabel: inf+' · PPS',
        prompt: ru,
        answers, speakAfter: full, rule:'pps_irregulares',
        conj:{v, tense:'pps', person:p}
      });
    });
  });
  SES = {queue: shuffle(qs), i:0, right:0, wrong:0, again:[], log:[],
         title:'⚡ PPS: ser · ir · estar · ter'};
  renderSession();
}

     ${[['conj','Времена и спряжения'],['trans','Перевод с русского'],['rules','Грамматика и предлоги'],['vocab','Лексика']]
       .map(([k,n])=>`<label class="set">${n}
         <input type="range" min="0" max="60" step="5" value="${s.focus[k]}" data-focus="${k}" style="width:130px">
         <span class="small muted" id="f-${k}" style="width:38px;text-align:right">${s.focus[k]}%</span></label>`).join('')}
     <div class="small muted">Доли применяются к новым карточкам; всё, что пора повторить, идёт в сессию в любом случае.</div>
   </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('len').onchange = e=>{ s.len=+e.target.value; save(); };
  document.getElementById('np').onchange = e=>{ s.newPerDay=+e.target.value; save(); };
  document.getElementById('strict').onchange = e=>{ s.strict=e.target.checked; save(); };
  document.getElementById('speak').onchange = e=>{ s.speak=e.target.checked; save(); };
  document.getElementById('aikSave').onclick = async ()=>{
    const v = document.getElementById('aik').value.replace(/\s+/g,'');
    const st = document.getElementById('aikStatus');
    if(!v){ localStorage.removeItem(AI_KEY_STORE); setView(); return; }
    localStorage.setItem(AI_KEY_STORE, v);
    st.textContent = 'проверяю ключ…';
    try{
      const r = await fetch('https://api.openai.com/v1/models', {headers:{'Authorization':'Bearer '+v}});
      st.textContent = r.ok ? '✓ ключ работает ('+v.slice(0,10)+'…, '+v.length+' симв.)'
        : '✗ ключ не принят ('+r.status+') — длина '+v.length+' симв., должно быть ~164';
      st.style.color = r.ok ? 'var(--accent)' : 'var(--warn)';
    }catch(e){ st.textContent = '✗ нет связи с api.openai.com'; st.style.color='var(--warn)'; }
  };
  document.querySelectorAll('[data-u]').forEach(b=> b.onclick = ()=>{
    const u=+b.dataset.u;
    s.units = s.units.includes(u) ? s.units.filter(x=>x!==u) : [...s.units,u].sort();
    if(!s.units.length) s.units=[u];
    save(); setView(); });
  document.querySelectorAll('[data-focus]').forEach(r=> r.oninput = ()=>{
    s.focus[r.dataset.focus] = +r.value;
    document.getElementById('f-'+r.dataset.focus).textContent = r.value+'%'; save(); });
}

/* ---------- проверка новой версии ---------- */
function checkUpdate(){
  fetch(location.pathname, {cache:'no-store'})
    .then(r=>r.text())
    .then(t=>{
      const m = t.match(/BUILD_ID = '([^']+)'/);
      if(m && m[1] !== BUILD_ID){
        if(document.getElementById('updChip')) return;
        const b = document.createElement('button');
        b.id='updChip'; b.className='btn';
        b.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;box-shadow:var(--shadow)';
        b.textContent = '⬆️ Доступна новая версия — обновить';
        b.onclick = ()=> location.reload();
        document.body.appendChild(b);
      }
    }).catch(()=>{});
}
setTimeout(checkUpdate, 3000);
setInterval(checkUpdate, 10*60*1000);

/* ---------- старт ---------- */
document.getElementById('topSet').onclick = ()=>{ if(SES){ SES=null; } setView(); };
buildPool();
home();

</script>
</body>
</html>
