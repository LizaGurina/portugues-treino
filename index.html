<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Português a Valer 1 — ежедневный тренажёр</title>
<style>
:root{
  --bg:#faf7f2; --panel:#fff; --ink:#1d1b18; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#0a6b4d; --accent-soft:#e3f1ea; --warn:#b3261e; --warn-soft:#fbe9e7;
  --gold:#b98900; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14130f; --panel:#1d1c18; --ink:#f0ece5; --muted:#a09a90; --line:#2f2d27;
        --accent:#4cc79b; --accent-soft:#12352a; --warn:#ff8a80; --warn-soft:#3a1c19;
        --gold:#e0b34d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.chip b{color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px 18px;
  font-weight:600;font-size:15px;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.hot{border-color:var(--warn);color:var(--warn);font-weight:700}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  text-align:left;transition:border-color .15s,transform .05s}
.mode:hover{border-color:var(--accent)}
.mode:active{transform:scale(.99)}
.mode .t{font-weight:640;font-size:14.5px;margin-bottom:3px}
.mode .d{font-size:12.5px;color:var(--muted);line-height:1.4}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* --- session --- */
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.prompt{font-size:24px;line-height:1.35;font-weight:600;letter-spacing:-.02em;margin:2px 0 6px}
.prompt.pt{font-style:normal}
.prompt small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0}
.gapline{font-size:20px;line-height:1.5;font-weight:500}
.gapline u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 22px}
input.answer{width:100%;font:inherit;font-size:19px;padding:13px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:14px}
input.answer:focus{outline:none;border-color:var(--accent)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.accents button{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  min-width:34px;height:32px;font-size:15px;color:var(--ink)}
.accents button:hover{background:var(--accent-soft)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);
  border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:16.5px;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt .k{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:6px;background:var(--line);font-size:12px;color:var(--muted);flex:none}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--warn);background:var(--warn-soft)}
.verdict{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:15px;line-height:1.5}
.verdict.ok{background:var(--accent-soft);border:1px solid var(--accent)}
.verdict.no{background:var(--warn-soft);border:1px solid var(--warn)}
.verdict .big{font-size:18px;font-weight:640;letter-spacing:-.01em}
.verdict .ru{color:var(--muted);font-size:14px;margin-top:4px}
.diff b{background:rgba(185,137,0,.28);border-radius:3px;padding:0 1px}
.wr{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:3px;font-weight:600}
.miss{opacity:.55;text-decoration:line-through}
.speak{background:none;border:none;color:var(--muted);font-size:17px;padding:2px 6px;border-radius:8px}
.speak:hover{background:var(--accent-soft);color:var(--accent)}
.ruleref{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.ruleref b{color:var(--ink)}
table.conj{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
table.conj td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.conj td:first-child{color:var(--muted);width:42%}
table.conj tr.hi td{background:var(--accent-soft);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.02em}
.rule{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--panel);overflow:hidden}
.rule>summary{padding:14px 16px;cursor:pointer;font-weight:620;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.rule>summary::-webkit-details-marker{display:none}
.rule>summary:after{content:"›";margin-left:auto;color:var(--muted);transform:rotate(90deg);transition:.2s}
.rule[open]>summary:after{transform:rotate(270deg)}
.rule .body{padding:0 16px 16px;font-size:14.5px;line-height:1.6}
.rule .ex{margin-top:10px;border-left:2px solid var(--accent);padding-left:12px}
.rule .ex div{margin-bottom:7px}
.rule .ex .p{font-weight:560}
.rule .ex .r{color:var(--muted);font-size:13.5px}
.statline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.statline .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:99px;background:var(--line);width:90px;overflow:hidden;flex:none}
.mini>i{display:block;height:100%;background:var(--accent)}
label.set{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px}
label.set input,label.set select{margin-left:auto;font:inherit}
.hidden{display:none!important}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent)}
.dots i.bad{background:var(--warn)}
.dots i.fixed{background:var(--gold)}
.done-hero{text-align:center;padding:26px 10px}
.done-hero .em{font-size:44px}
.done-hero h3{margin:10px 0 6px;font-size:20px}
kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
</style>
</head>

</header>
<div id="view"></div>
</div>

id":"artigos","unit":1,"title":"Артикли","body":"Определённые: <b>o / a / os / as</b>. Ставятся перед именами людей, названиями стран и некоторых городов: <i>o Paulo, a Ana, a França, o Porto</i>.<br>Неопределённые: <b>um / uma / uns / umas</b>.<br>Перед названиями городов артикля обычно нет: <i>em Lisboa, de Coimbra</i>, но <i>no Porto, no Rio de Janeiro</i>.<br><br><b>Первое упоминание → um/uma, дальше → o/a.</b> Когда предмет появляется в рассказе впервые (новый для слушателя), берём неопределённый артикль; когда возвращаемся к нему — определённый: <i>A Rita tem <b>um</b> presente. <b>O</b> presente é <b>um</b> livro.</i>","ex":[["Eu sou a Teresa.","Я Тереза."],["A Ana mora num apartamento. O apartamento tem uma varanda.","Ана живёт в (какой-то) квартире. В (этой) квартире есть балкон."],["Precisamos de um mapa.","Нам нужна карта (какая-нибудь)."],["O Paulo e a Ana são irmãos.","Паулу и Ана — брат и сестра."]]},{"id":"pres_regulares","unit":3,"title":"Presente do Indicativo — правильные глаголы","body":"<b>-ar</b>: -o, -as, -a, -amos, -am (falar → falo, falas, fala, falamos, falam)<br><b>-er</b>: -o, -es, -e, -emos, -em (comer → como, comes, come, comemos, comem)<br><b>-ir</b>: -o, -es, -e, -imos, -em (decidir → decido, decides, decide, decidimos, decidem)<br>Графические изменения в 1 л. ед. ч.: <i>conhecer → conheço, descer → desço, vestir → visto, preferir → prefiro, conseguir → consigo, dormir → durmo, pedir → peço, perder → perco</i>.","ex":[["Eu vivo em Leiria.","Я живу в Лейрии."],["Vocês conhecem Portugal?","Вы знаете Португалию?"],["Ela prefere alimentos sem glúten.","Она предпочитает еду без глютена."]]},{"id":"reflexos","unit":3,"title":"Возвратные глаголы и место местоимения","body":"Обычно местоимение стоит <b>после</b> глагола через дефис: <i>chamo-me, levanto-me, veste-se</i>.<br>В 1 л. мн. ч. -s исчезает: <i>chamamos + nos → chamamo-nos</i>.<br>Местоимение уходит <b>перед</b> глаголом после: <i>não, nunca, também, só, já, que, onde, como, porque, todos</i> и в вопросах с вопросительным словом.","ex":[["Eu chamo-me Rafaela.","Меня зовут Рафаэла."],["Eu não me chamo Rafaela.","Меня не зовут Рафаэла. (отрицание → перед глаголом)"],["Como te chamas?","Как тебя зовут? (вопросительное слово → перед глаголом)"],["Eu visto-me quando me levanto.","Я одеваюсь, когда встаю."]]},{"id":"de_em_paises","unit":1,"title":"Предлоги de и em: страны и города","body":"<b>de</b> + происхождение (с глаголом ser): <i>Nós somos da Argentina.</i><br><b>em</b> + место жительства (с глаголом morar): <i>Nós moramos em Portimão.</i><br>Со странами артикль есть → предлог сливается: <b>de + a = da, de + o = do, em + a = na, em + o = no</b>.<br>С городами артикля обычно нет: <i>de Braga, em Lisboa</i>. Исключения: <i>no Porto, no Rio de Janeiro</i>.","ex":[["A Margarida é de Braga.","Маргарида из Браги."],["O Sr. Pereira mora na Rússia.","Сеньор Перейра живёт в России."],["Eu sou de Portugal e moro no Porto.","Я из Португалии и живу в Порту."]]},{"id":"possessivos","unit":2,"title":"Притяжательные","body":"Согласуются с <b>предметом</b>, а не с владельцем, и обычно идут с артиклем: <i>o meu carro, a minha casa, os meus livros, as minhas chaves</i>.<br>eu → meu/minha · tu → teu/tua · você, ele, ela → seu/sua (или dele/dela) · nós → nosso/nossa · vocês, eles → vosso/vossa (или deles/delas).","ex":[["Emília, esta garrafa de água é tua?","Эмилия, это твоя бутылка воды?"],["Peter e Elena, têm os vossos cadernos?","Питер и Елена, у вас есть ваши тетради?"],["A mãe dela é professora.","Её мама — учительница."]]},{"id":"prep_tempo","unit":3,"title":"Предлоги времени a, de, em","body":"<b>a</b> — часы, части дня, дни недели как <i>привычка</i>: <i>às 17:00, à noite, à segunda-feira</i><br><b>de</b> — часть дня после указания часа: <i>às cinco da tarde</i>; <i>de manhã, de tarde, de noite</i><br><b>em</b> — дни недели как <i>разовое событие</i>: <i>no domingo, na sexta-feira</i><br>Слияния: a+o=ao, a+a=à, a+os=aos, a+as=às · de+o=do, de+a=da · em+o=no, em+a=na","ex":[["À sexta-feira à noite, costumo ir ao cinema.","По пятницам вечером я обычно хожу в кино. (привычка)"],["No domingo, vamos ao Porto?","В воскресенье поедем в Порту? (разовое)"],["Ele chega às cinco da tarde.","Он приходит в пять вечера."]]},{"id":"ter_de","unit":4,"title":"Ter de + инфинитив","body":"Выражает <b>необходимость и обязанность</b>: «должен, надо».<br>tenho de · tens de · tem de · temos de · têm de + инфинитив.","ex":[["Está muito frio. Temos de vestir o casaco.","Очень холодно. Нам надо надеть куртку."],["Tu tens de comer melhor.","Тебе нужно лучше питаться."],["Elas têm de apanhar o metro.","Им надо сесть на метро."]]},{"id":"estar_a","unit":4,"title":"Estar a + Infinitivo (действие сейчас)","body":"Действие происходит <b>прямо сейчас</b>, в момент речи. Аналог английского present continuous.<br>Формально это <i>perífrase verbal</i> (глагольная конструкция), а не отдельное время.<br>estou a · estás a · está a · estamos a · estão a + инфинитив.<br>У возвратных глаголов местоимение переходит к инфинитиву: <i>estou a levantar-me</i>.","ex":[["Eu estou a ler o livro.","Я сейчас читаю книгу."],["Agora, a Rute está a estudar, porque tem exame amanhã.","Сейчас Рут занимается, потому что завтра экзамен."],["Tu estás a pentear-te.","Ты сейчас причёсываешься."]]},{"id":"comparativo","unit":4,"title":"Сравнительная степень: больше / меньше","body":"<b>mais</b> + прилагательное/наречие + <b>do que</b><br><b>menos</b> + прилагательное/наречие + <b>do que</b><br>Исключения: bom → <b>melhor do que</b> · mau → <b>pior do que</b> · grande → <b>maior do que</b>.","ex":[["Eu sou mais alto do que o meu irmão.","Я выше своего брата."],["Este prato é menos caro do que aquele.","Это блюдо дешевле того."],["Lisboa é maior do que Coimbra.","Лиссабон больше Коимбры."]]},{"id":"prep_movimento","unit":4,"title":"Предлоги движения a, para, por","body":"<b>a</b> — ненадолго, с возвращением: <i>Vou à padaria e volto já.</i><br><b>para</b> — надолго или конечный пункт: <i>Vou para a biblioteca. Até logo!</i><br><b>por</b> — путь, маршрут: <i>Hoje, vamos pela avenida.</i><br>por + o = pelo, por + a = pela, por + os = pelos, por + as = pelas","ex":[["A Maria vai para Portimão passar férias.","Мария едет в Портиман на отпуск."],["Eu vou a casa e volto já.","Я схожу домой и сразу вернусь."],["Hoje, a Rita passa pela casa da avó.","Сегодня Рита заходит к бабушке."]]},{"id":"transportes","unit":4,"title":"Транспорт: de или em","body":"<b>de</b> + транспорт вообще, без уточнения: <i>de carro, de autocarro, de avião</i>. Исключение: <b>ir a pé</b> — идти пешком.<br><b>em</b> + конкретный транспорт: <i>no avião da TAP, no carro do meu pai, no elétrico n.º 28</i>.","ex":[["O Juan vai de mota para o trabalho.","Хуан ездит на работу на мотоцикле."],["Nós vamos para os Açores no avião da TAP.","Мы летим на Азоры самолётом TAP."],["Muitos alunos vão a pé para a escola.","Многие ученики ходят в школу пешком."]]},{"id":"com_pronome","unit":4,"title":"Предлог com + местоимение","body":"com + eu → <b>comigo</b> · com + tu → <b>contigo</b> · com + você/о senhor → <b>consigo</b> · com + nós → <b>connosco</b> · com + vocês/os senhores → <b>convosco</b><br>С ela/ele/elas/eles ничего не сливается: <i>com ela, com eles</i>.","ex":[["Ela vai comigo ao oculista.","Она идёт со мной к окулисту."],["Carlos, eu vou contigo ao hospital.","Карлуш, я пойду с тобой в больницу."],["A Bruna estuda convosco?","Бруна занимается с вами?"]]},{"id":"ir_inf","unit":5,"title":"Ir + Infinitivo (будущее)","body":"Планы и действия в будущем: «собираюсь / буду». Это <i>futuro perifrástico</i> — глагольная конструкция (perífrase), а не простое будущее время.<br>vou · vais · vai · vamos · vão + инфинитив.","ex":[["Eu vou sair de casa às 9:00.","Я выйду из дома в 9:00."],["Vocês vão arrendar um apartamento nas férias.","Вы снимете квартиру на отпуск."],["Amanhã, vai chover.","Завтра будет дождь."]]},{"id":"saber_conhecer","unit":5,"title":"Conhecer, saber, conseguir, poder","body":"<b>conhecer</b> — быть знакомым: место, книга, человек.<br><b>saber</b> — знать факт; уметь (навык).<br><b>conseguir</b> — быть в состоянии, справляться физически.<br><b>poder</b> — возможность, разрешение; в отрицании — запрет.","ex":[["Eu não conheço o Alentejo.","Я не знаю (не бывала в) Алентежу."],["Ele sabe cozinhar pratos tailandeses.","Он умеет готовить тайские блюда."],["Eu não consigo dizer esta palavra.","У меня не получается произнести это слово."],["Na biblioteca, nós não podemos falar ao telemóvel.","В библиотеке нельзя говорить по телефону."]]},{"id":"ha_desde","unit":5,"title":"Há и desde","body":"<b>há</b> + <i>отрезок</i> времени: сколько времени уже длится. <i>há dois anos, há um mês</i><br><b>desde</b> + <i>точка отсчёта</i>: с какого момента. <i>desde 2020, desde criança, desde que...</i><br>Оба употребляются с настоящим временем.","ex":[["O Yasir vive em Portugal há dois anos.","Ясир живёт в Португалии два года."],["O Cristiano está na biblioteca desde o início da tarde.","Криштиану в библиотеке с начала дня."],["A Olívia faz campismo desde criança.","Оливия ходит в походы с детства."]]},{"id":"igualdade","unit":5,"title":"Сравнение равенства: tão / tanto ... como","body":"<b>tão</b> + прилагательное/наречие + <b>como</b><br><b>tanto/tanta/tantos/tantas</b> + существительное + <b>como</b> (согласуется с существительным).","ex":[["A Francisca é tão alta como a irmã.","Франсишка такая же высокая, как сестра."],["O Luís tem tantas férias como a minha namorada.","У Луиша столько же отпуска, сколько у моей девушки."],["Eu bebo tanta água como tu.","Я пью столько же воды, сколько ты."]]},{"id":"ci_pronome","unit":5,"title":"Местоимения косвенного дополнения (кому?)","body":"me · te · lhe (você, ela, ele) · nos · vos · lhes<br>Обычно <b>после</b> глагола через дефис: <i>A Sara dá-lhe o casaco.</i><br><b>Перед</b> глаголом — после não, nunca, também, só, já, que, onde и вопросительных слов.","ex":[["A Sara dá-lhe o casaco.","Сара даёт ему куртку."],["O Peter não lhe telefona.","Питер ей не звонит."],["Nós emprestamos-lhe o caderno.","Мы одалживаем ему тетрадь."]]},{"id":"prep_pronome","unit":5,"title":"para, por, sem, de + местоимение","body":"para <b>mim</b> · para <b>ti</b> · para <b>si</b> (você, о senhor) · para ela/ele · para nós · para vocês · para elas/eles.<br>Так же с <i>por, sem, de</i>: <i>sem mim, por ti, de ti</i>.","ex":[["Para ti, qual é a melhor praia portuguesa?","Какой, по-твоему, лучший португальский пляж?"],["Podes ir ao cinema sem mim.","Можешь пойти в кино без меня."],["Dr. Pedro, este dossiê é para si.","Доктор Педру, эта папка для вас."]]},{"id":"em_meses","unit":5,"title":"Предлог em: месяцы, времена года, праздники","body":"С месяцами — просто <b>em</b>: <i>em junho, em janeiro</i>.<br>С временами года — <b>с артиклем</b>: <i>na primavera, no verão, no outono, no inverno</i>.<br>С праздниками — тоже с артиклем: <i>no Natal, na Páscoa, no Ano Novo</i>.","ex":[["A Isabel vai fazer uma viagem em junho.","Изабел поедет в путешествие в июне."],["Na primavera, gosto de passear pelos campos.","Весной я люблю гулять по полям."],["No Natal, costumamos comer bacalhau.","На Рождество мы обычно едим треску."]]},{"id":"conectores","unit":5,"title":"Союзы e, mas, porque, quando","body":"<b>e</b> — добавление · <b>mas</b> — противопоставление · <b>porque</b> — причина · <b>quando</b> — время.","ex":[["A Luísa vive junto ao mar, mas não gosta de peixe.","Луиза живёт у моря, но не любит рыбу."],["A Mariana está cansada porque trabalha muito.","Мариана устала, потому что много работает."],["Quando está sol, vamos correr à beira-mar.","Когда солнечно, мы бегаем у моря."]]},{"id":"imperativo","unit":6,"title":"Императив: fala / não fales · fale · falem","body":"<b>tu</b>: берём форму 3 л. ед. ч. настоящего времени → <i>ele compra → Compra os medicamentos!</i><br><b>você</b>: берём 1 л. ед. ч. и меняем окончание:<br>-ar → <b>-e</b>: eu procuro → <i>procure</i> · -er → <b>-a</b>: eu como → <i>coma</i> · -ir → <b>-a</b>: eu visto → <i>vista</i>; vocês: <i>falem, comam, vistam</i><br><b>Запрет (não + …)</b>: на «ты» — та же формальная основа + s: <i>fala → não fales, come → não comas</i>; для você/vocês — просто não + форма: <i>não fale, não falem</i>.<br>Глагол pôr идёт по правилу -er: eu ponho → <i>ponha</i>.","ex":[["Fátima, procure a ficha do doente no arquivo.","Фатима, найдите карту пациента в архиве."],["Rita, coma alimentos mais saudáveis.","Рита, ешьте более здоровую еду."],["Faz este exercício antes de a aula acabar.","Сделай это упражнение до конца урока."]]},{"id":"para_por","unit":6,"title":"Para и por","body":"<b>para</b>: цель (<i>para ganhar mais</i>), направление/пункт назначения (<i>vão para Lisboa</i>), мнение (<i>para nós, é o melhor</i>).<br><b>por</b>: причина (<i>por ter alergias</i>), маршрут (<i>passam por Coimbra</i>), продолжительность (<i>por um mês</i>), приблизительное время (<i>pelas onze</i>).","ex":[["Ele trabalha muito para ganhar mais dinheiro.","Он много работает, чтобы больше зарабатывать."],["A Marta espirra muito por ter alergias.","Марта часто чихает из-за аллергии."],["Nós devemos chegar ao Porto pelas 20:00.","Мы должны приехать в Порту около 20:00."]]},{"id":"tao_tanto","unit":7,"title":"Tão и tanto в восклицаниях","body":"<b>tão</b> + прилагательное или наречие: <i>O Luís é tão tímido!</i><br><b>tanto / tanta / tantos / tantas</b> + существительное (согласуется в роде и числе): <i>tanto açúcar, tanta fome, tantos doces, tantas horas</i>.","ex":[["Hoje, tenho tanta fome!","Сегодня я такая голодная!"],["Tu falas tão baixo!","Ты говоришь так тихо!"],["A Cátia trabalha tantas horas!","Катя работает столько часов!"]]},{"id":"indefinidos","unit":7,"title":"Неопределённые местоимения","body":"Изменяемые: algum/alguma/alguns/algumas · nenhum/nenhuma · muito · pouco · todo · outro — согласуются с существительным.<br>Неизменяемые: <b>alguém / ninguém</b> (о людях), <b>tudo / nada</b> (о вещах).","ex":[["Vês alguém no jardim?","Ты видишь кого-то в саду?"],["Eu não conheço ninguém na festa.","Я никого не знаю на вечеринке."],["Vou para Cabo Verde todos os anos.","Я езжу в Кабо-Верде каждый год."]]},{"id":"marcadores_temp","unit":7,"title":"antes de, depois de, quando, enquanto","body":"<b>antes de</b> — до (действие раньше) · <b>depois de</b> — после · <b>quando</b> — в момент действия · <b>enquanto</b> — одновременно, пока.<br>antes/depois + de сливается с артиклем: <i>antes do Carnaval, depois da aula</i>.","ex":[["Antes do Carnaval, as crianças escolhem os disfarces.","Перед карнавалом дети выбирают костюмы."],["Eu tomo um café depois do almoço.","Я пью кофе после обеда."],["A Luísa faz os convites enquanto o marido reserva o restaurante.","Луиза делает приглашения, пока муж бронирует ресторан."]]},{"id":"pps_regulares","unit":8,"title":"Pretérito Perfeito Simples — правильные глаголы","body":"Завершённое действие в прошлом.<br><b>-ar</b>: -ei, -aste, -ou, -ámos, -aram (trabalhar → trabalhei, trabalhaste, trabalhou, trabalhámos, trabalharam)<br><b>-er</b>: -i, -este, -eu, -emos, -eram (comer → comi, comeste, comeu, comemos, comeram)<br><b>-ir</b>: -i, -iste, -iu, -imos, -iram (vestir → vesti, vestiste, vestiu, vestimos, vestiram)<br>Орфография в 1 л. ед. ч.: <i>ficar → fiquei · pagar → paguei · começar → comecei</i>.","ex":[["Eu não trabalhei esta semana.","Я не работала на этой неделе."],["No domingo passado, nós comemos cachupa.","В прошлое воскресенье мы ели кашупу."],["Ontem, o Tiago vestiu o casaco.","Вчера Тиагу надел куртку."]]},{"id":"pps_irregulares","unit":8,"title":"PPS — неправильные: ir/ser, estar, ter","body":"<b>ir</b> и <b>ser</b> совпадают: fui, foste, foi, fomos, foram<br><b>estar</b>: estive, estiveste, esteve, estivemos, estiveram<br><b>ter</b>: tive, tiveste, teve, tivemos, tiveram","ex":[["No sábado à noite, tu foste ao cinema?","В субботу вечером ты ходила в кино?"],["Ontem, o empregado foi muito simpático.","Вчера официант был очень любезен."],["Hoje de manhã, a Annika teve um acidente.","Сегодня утром у Анники была авария."]]},{"id":"pps_marcadores","unit":8,"title":"Маркеры прошедшего времени","body":"ontem · na semana passada · no mês passado · no ano passado · em 2020 · <b>já</b> (уже) · <b>nunca</b> (никогда) · <b>ainda não</b> (ещё не).","ex":[["Nós já fomos ao Gerês.","Мы уже были в Жерес."],["Tu nunca estiveste em minha casa.","Ты никогда не была у меня дома."],["A Teresa ainda não chegou a Cabo Verde.","Тереза ещё не приехала в Кабо-Верде."]]},{"id":"lugar","unit":2,"title":"Выражения места","body":"dentro de · ao lado de · em frente de · atrás de · debaixo de · em cima de · entre<br>Все с <b>de</b>, а значит сливаются с артиклем: <i>ao lado do estojo, debaixo da mesa</i>.","ex":[["O livro está ao lado do estojo.","Книга рядом с пеналом."],["O sapato está debaixo da mesa.","Туфля под столом."],["O gato está entre a mesa e a mala.","Кот между столом и сумкой."]]},{"id":"contracoes","unit":3,"title":"Слияния предлогов с артиклями","body":"de + o/a/os/as = <b>do, da, dos, das</b><br>em + o/a/os/as = <b>no, na, nos, nas</b><br>a + o/a/os/as = <b>ao, à, aos, às</b><br>por + o/a/os/as = <b>pelo, pela, pelos, pelas</b>","ex":[["A Rita é de Lisboa, mas mora em Coimbra.","Рита из Лиссабона, но живёт в Коимбре."],["Brasília é a capital do Brasil.","Бразилиа — столица Бразилии."],["O metro passa pela Avenida da Liberdade.","Метро проходит по Авениде да Либердаде."]]},{"id":"demonstrativos","unit":2,"title":"Указательные: este / esse / aquele, isto / isso / aquilo","body":"<b>este/esta/estes/estas</b> — близко к говорящему (здесь)<br><b>esse/essa/esses/essas</b> — близко к собеседнику (там, у тебя)<br><b>aquele/aquela/aqueles/aquelas</b> — далеко от обоих (вон там)<br>Средний род (о неназванном предмете): <b>isto</b> (это здесь) · <b>isso</b> (то у тебя) · <b>aquilo</b> (вон то).","ex":[["Este é o Filipe, o meu colega de trabalho.","Это Филипе, мой коллега. (рядом со мной)"],["Essa pasta é sua?","Эта папка (у вас) ваша?"],["O que é isto?","Что это (у меня в руках)?"],["Aquela casa é muito bonita.","Вон тот дом очень красивый."]]},{"id":"cortesia","unit":3,"title":"Queria… / Podia…? — вежливая просьба","body":"Форма вежливости (imperfeito de cortesia): вместо «quero» говорят <b>queria</b> — «я бы хотел(а)», вместо «pode» — <b>podia</b> — «не могли бы вы».<br>queria + существительное/инфинитив · podia + инфинитив.","ex":[["Queria um café, por favor.","Я бы хотела кофе, пожалуйста."],["Queria reservar uma mesa.","Я бы хотела забронировать столик."],["Podia dizer-me onde fica a Câmara Municipal?","Не могли бы вы сказать, где мэрия?"],["Podia repetir, por favor?","Не могли бы вы повторить?"]]},{"id":"costumar","unit":3,"title":"Costumar + инфинитив — «обычно»","body":"Привычное, регулярное действие: <b>costumo, costumas, costuma, costumamos, costumam</b> + инфинитив.<br>Отвечает на «что ты обычно делаешь?»","ex":[["Eu costumo almoçar ao meio-dia.","Я обычно обедаю в полдень."],["O Fred costuma almoçar no restaurante à quarta-feira.","Фред обычно обедает в ресторане по средам."],["Nós costumamos ver um filme ao fim de semana.","Мы обычно смотрим фильм по выходным."]]},{"id":"precisar_dever","unit":6,"title":"Precisar de и dever + инфинитив","body":"<b>ter de</b> — жёсткая необходимость («должен») · <b>precisar de</b> — нужда («мне нужно») · <b>dever</b> — совет, рекомендация («следует, стоит»).<br>precisar всегда с <b>de</b>: <i>preciso de estudar</i>; dever — без предлога: <i>deves dormir mais</i>.","ex":[["Preciso de ir à farmácia.","Мне нужно в аптеку."],["Estás doente: deves ficar em casa.","Ты болеешь: тебе стоит остаться дома."],["Tenho de estudar para o exame.","Я должна заниматься перед экзаменом."]]},{"id":"estar_com_ter","unit":6,"title":"Estar com / Ter + существительное","body":"Состояния выражаются двумя способами: <b>ter</b> + nome (постояннее) и <b>estar com</b> + nome (прямо сейчас).<br><i>fome</i> (голод), <i>sede</i> (жажда), <i>frio, calor, febre, sono</i> (сонливость), <i>medo</i> (страх), <i>dores</i>.","ex":[["Estou com fome.","Я голодная (сейчас)."],["O bebé está com sono.","Малыш хочет спать."],["Tenho febre e dores de cabeça.","У меня температура и болит голова."],["Estás com frio? Veste o casaco!","Тебе холодно? Надень куртку!"]]},{"id":"impessoal_se","unit":7,"title":"Безличная форма c se","body":"Действие без конкретного деятеля — «здесь говорят / едят / продаётся»: глагол в 3-м лице + <b>se</b>.<br>Единственное или множественное число — по существительному: <i>fala-se português</i>, <i>comem-se tantos doces</i>.","ex":[["Em Portugal, fala-se português.","В Португалии говорят по-португальски."],["No Natal, comem-se muitos doces.","На Рождество едят много сладостей."],["Come-se muito bem neste restaurante.","В этом ресторане очень хорошо кормят."]]},{"id":"andar_adj","unit":6,"title":"Andar + прилагательное — «в последнее время»","body":"<b>andar</b> + прилагательное описывает затянувшееся состояние (не разовый момент, как estar):<br><i>ando cansada</i> — я в последнее время усталая.","ex":[["Os pais da Maria andam nervosos.","Родители Марии в последнее время нервничают."],["Eu ando cansado por ter muito trabalho.","Я всё время усталый из-за большой нагрузки."],["Tu andas muito ocupada?","Ты в последнее время очень занята?"]]},{"id":"ordinais","unit":1,"title":"Порядковые числительные (1.º–6.º)","body":"<b>primeiro, segundo, terceiro, quarto, quinto, sexto</b> — согласуются в роде и числе: <i>a primeira rua, o terceiro andar</i>.<br>В адресах и этажах: <i>no segundo andar</i>; в датах не используются (там количественные: <i>treze de junho</i>).","ex":[["Vira na primeira rua à direita.","Поверни на первой улице направо."],["O escritório fica no terceiro andar.","Офис на третьем этаже."],["É a segunda vez que visito Lisboa.","Я во второй раз в Лиссабоне."]]},{"id":"números","unit":4,"title":"Числа до 1000","body":"16–19: <b>dezasseis, dezassete, dezoito, dezanove</b> (европейская норма).<br>Десятки + единицы через <b>e</b>: <i>vinte e um, quarenta e dois</i>.<br><b>cem</b> — ровно 100, <b>cento e</b> — 101–199: <i>cento e quinze</i>.<br>200–900: <i>duzentos, trezentos, quatrocentos, quinhentos, seiscentos, setecentos, oitocentos, novecentos</i> · 1000 — <b>mil</b>.","ex":[["quarenta e dois","42"],["cento e quinze","115"],["quinhentos e dezasseis","516"],["novecentos e noventa e nove","999"]]},{"id":"horas","unit":3,"title":"Который час","body":"<b>Que horas são?</b> — «Который час?»<br><b>São</b> + число (ж. р.: <i>uma, duas</i>): <i>São três horas. É uma hora.</i><br><i>e meia</i> — половина · <i>e um quarto</i> — четверть · минуты просто числом: <i>dez e vinte</i>.<br><b>meio-dia</b> — полдень · <b>meia-noite</b> — полночь · часть дня: <i>da manhã, da tarde, da noite</i>.","ex":[["São nove e meia da manhã.","Половина десятого утра (9:30)."],["É uma e um quarto.","Четверть второго (1:15)."],["O comboio parte ao meio-dia.","Поезд отходит в полдень."],["São cinco da tarde.","Пять часов вечера (17:00)."]]},{"id":"e_que","unit":1,"title":"Вопросы с é que","body":"В разговорных вопросах после вопросительного слова почти всегда вставляется <b>é que</b> — это не переводится и не меняет смысл, но звучит естественно:<br><i>Onde moras?</i> → <b>Onde é que moras?</b><br>После é que порядок слов прямой (подлежащее перед глаголом).","ex":[["Como é que te chamas?","Как тебя зовут?"],["Onde é que vocês moram?","Где вы живёте?"],["Porque é que não vens connosco?","Почему ты не идёшь с нами?"],["A que horas é que começa a aula?","Во сколько начинается урок?"]]}],"gaps":[{"rule":"de_em_paises","s":"A Augusta é ___ Camarões.","a":"dos","alts":[],"unit":1,"hint":"os Camarões"},{"rule":"de_em_paises","s":"A Sari e eu somos ___ Filipinas.","a":"das","alts":[],"unit":1,"hint":"as Filipinas"},{"rule":"de_em_paises","s":"O Philip é ___ Alemanha.","a":"da","alts":[],"unit":1,"hint":"a Alemanha"},{"rule":"de_em_paises","s":"O Kevin é ___ Chile.","a":"do","alts":[],"unit":1,"hint":"o Chile"},{"rule":"de_em_paises","s":"Nós  'onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove','vinte'];
const NUM_TENS = {20:'vinte',30:'trinta',40:'quarenta',50:'cinquenta',60:'sessenta',
 70:'setenta',80:'oitenta',90:'noventa'};
const NUM_HUNDREDS = {100:'cem',200:'duzentos',300:'trezentos',400:'quatrocentos',500:'quinhentos',
 600:'seiscentos',700:'setecentos',800:'oitocentos',900:'novecentos'};

function numToPt(n){
  if(n===1000) return 'mil';
  if(n<=20) return NUM_UNITS[n];
  if(n<100){
    const t = Math.floor(n/10)*10, u = n%10;
    return u? NUM_TENS[t]+' e '+NUM_UNITS[u] : NUM_TENS[t];
  }
  const h = Math.floor(n/100)*100, rest = n%100;
  if(!rest) return NUM_HUNDREDS[h];
  const hw = h===100? 'cento' : NUM_HUNDREDS[h];
  return hw + ' e ' + numToPt(rest);
}

function horaWords(t){        // все допустимые прочтения
  let [h,m] = t.split(':').map(Number);
  const fem = n => n===1?'uma': n===2?'duas': numToPt(n);
  const out = [];
  const push = s => { if(!out.includes(s)) out.push(s); };
  if(h===12 && m===0){ push('meio-dia'); push('é meio-dia'); return out; }
  if(h===0 && m===0){ push('meia-noite'); push('é meia-noite'); return out; }
  const parte = h>=6&&h<12 ? 'da manhã' : (h>=12&&h<20 ? 'da tarde' : 'da noite');
  const h12 = h%12===0? 12 : h%12;
  const base12 = fem(h12);
  const min = m===0? '' : m===30? ' e meia' : m===15? ' e um quarto' : ' e '+numToPt(m);
  const minNum = m===0? '' : ' e '+(m===30?'meia':m===15?'um quarto':numToPt(m));
  const verb = h12===1? 'é ' : 'são ';
  push(base12 + min + ' ' + parte);                 // «três e meia da tarde»
  push(verb + base12 + min + ' ' + parte);
  push(base12 + min);                               // «três e meia»
  if(m===0){ push(base12+' horas'); push(verb+base12+' horas'); push(base12+' horas '+parte); }
  if(m===15){ push(base12+' e quinze'); push(base12+' e quinze '+parte); }
  if(m===30){ push(base12+' e trinta'); push(base12+' e trinta '+parte); }
  if(m===45){ push(base12+' e quarenta e cinco'); push('um quarto para as '+fem(h12===12?1:h12+1)); }
  // 24-часовое прочтение
  push(fem(h) + (m? ' e '+numToPt(m):' horas'));
  return out;
}
function horaDigits(t){       // допустимые цифровые ответы на слух
  let [h,m] = t.split(':').map(Number);
  const mm = String(m).padStart(2,'0');
  const out = [`${h}:${mm}`];
  const h12 = h%12===0? 12 : h%12;
  if(h12!==h) out.push(`${h12}:${mm}`);
  if(h===0) out.push(`24:${mm}`,`12:${mm}`);
  return out;
}

/* ---------- Leitner ---------- */
const BOX_DAYS = [0,1,3,7,16,35];
function meta(id){ return S.items[id] || (S.items[id] = {b:0,due:null,r:0,w:0}); }
function schedule(id, ok){
  const m = meta(id);
  m.b = ok ? Math.min(5, m.b+1) : (m.b>=3 ? 1 : 0);
  ok ? m.r++ : m.w++;
  const d = new Date(); d.setDate(d.getDate() + BOX_DAYS[m.b]);
  m.due = d.toISOString().slice(0,10);
  m.seen = today();
}
const isDue = id => { const m=S.items[id]; return m && m.due && m.due <= today(); };

/* ---------- нормализация и сверка ---------- */
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s){
  return (s||'').toLowerCase().trim()
    .replace(/[«»""'']/g,'"').replace(/\s+/g,' ')
    .replace(/[.!?;,]+$/,'').replace(/\s([.,!?;:])/g,'$1');
}
const canon = s => norm(s).replace(/[.,!?;:«»"()]/g,'').replace(/\s+/g,' ').trim();
function check(given, answers){
  const g = canon(given);
  for(const a of answers){ if(g === canon(a)) return {ok:true, target:a}; }
  for(const a of answers){ if(strip(g) === strip(canon(a))) return {ok:!S.set.strict, near:true, target:a}; }
  // ближайший ответ для показа
  let best = answers[0], bs = -1;
  for(const a of answers){ const s = sim(g, norm(a)); if(s>bs){bs=s;best=a;} }
  return {ok:false, near:false, target:best};
}
function simTok(s){ return strip((s||'').toLowerCase()).split(/\s+/)
  .map(w=>w.replace(/[^a-z0-9-]/g,'')).filter(Boolean); }
function sim(a,b){ // доля общих слов (по нормализованной форме)
  const A = simTok(a), B = simTok(b);
  if(!A.length || !B.length) return 0;
  const setB = new Map(); B.forEach(w=>setB.set(w,(setB.get(w)||0)+1));
  let n=0; for(const w of A){ const c=setB.get(w)||0; if(c>0){ n++; setB.set(w,c-1); } }
  return 2*n/(A.length+B.length);
}
function diffHtml(given, target){
  const g = given.trim(), t = target;
  let out = '', i = 0;
  const gs = strip(g.toLowerCase()), ts = strip(t.toLowerCase());
  if(gs === ts){ // только диакритика
    for(i=0;i<t.length;i++){
      const same = g[i] && g[i].toLowerCase() === t[i].toLowerCase();
      out += same ? esc(t[i]) : '<b>'+esc(t[i])+'</b>';
    }
    return out;
  }
  return esc(t);
}
const esc = s => (s+'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* пословный дифф: LCS по нормализованным словам */
function wordDiff(given, target){
  const tokG = given.trim().split(/\s+/), tokT = target.trim().split(/\s+/);
  const nG = tokG.map(w=>strip(norm(w))), nT = tokT.map(w=>strip(norm(w)));
  const m = nG.length, n = nT.length;
  const L = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    L[i][j] = nG[i]===nT[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const okG = new Array(m).fill(false), okT = new Array(n).fill(false);
  let i=0, j=0;
  while(i<m && j<n){
    if(nG[i]===nT[j]){ okG[i]=true; okT[j]=true; i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) i++;
    else j++;
  }
  const exactT = {}; tokT.forEach((w,k)=>{ exactT[nT[k]] = exactT[nT[k]]||w; });
  const givenHtml = tokG.map((w,k)=>{
    if(!okG[k]) return `<span class="wr">${esc(w)}</span>`;
    const tw = exactT[nG[k]];
    if(tw && norm(w)!==norm(tw)) return `<span class="wr">${esc(w)}</span>`;
    return esc(w);
  }).join(' ');
  const targetHtml = tokT.map((w,k)=> okT[k] ? esc(w) : `<b>${esc(w)}</b>`).join(' ');
  return {givenHtml, targetHtml};
}

/* ---------- озвучка ---------- */
let voices = [];
function pickVoice(){
  voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='pt-PT') || voices.find(v=>v.lang&&v.lang.startsWith('pt')) || null;
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
function say(text){
  if(!S.set.speak || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/_+/g,' … '));
  const v = pickVoice(); if(v) u.voice = v;
  u.lang = 'pt-PT'; u.rate = .92;
  speechSynthesis.speak(u);
}

const IR    = ['vou','vais','vai','vamos','vão'];
const REFL  = ['me','te','se','nos','se'];

function conjForm(v, tense, p){
  if(tense==='pres') return v.pres[p];
  if(tense==='pps')  return v.pps ? v.pps[p] : null;
  if(v.impersonal && p!==2 && p!==4) return null;
  const inf = v.refl ? v.inf.slice(0,-2) + REFL[p] : v.inf;   // levantar-se → levantar-me
  const aux = (tense==='estar'?ESTAR:IR)[v.impersonal?2:p];
  return aux + ' ' + inf;
}

let POOL = [];
function buildPool(){
  POOL = [];
  // лексика
  DATA.vocab.forEach((w,i)=>{
    POOL.push({id:'v'+i, kind:'vocab', pt:w.pt, ru:w.ru, art:w.art, unit:w.unit, theme:w.theme, group:'vocab'});
    if(w.art) POOL.push({id:'g'+i, kind:'gender', pt:w.pt, ru:w.ru, art:w.art, unit:w.unit, theme:w.theme, group:'vocab'});
  });
  // спряжения
  DATA.verbs.forEach((v,i)=>{
    ['pres','estar','ir','pps'].forEach(t=>{
      if(t==='pps' && !v.pps) return;
      if(v.impersonal && (t==='estar')) return;
      POOL.push({id:'c'+i+t, kind:'conj', vi:i, tense:t, unit:v.unit, group:'conj', irr:!!v.irr,
                 rule: t==='pres'?'pres_regulares': t==='estar'?'estar_a': t==='ir'?'ir_inf':(v.pps&&DATA.ppsIrr.includes(v.inf)?'pps_irregulares':'pps_regulares')});
    });
  });
  DATA.verbDrills.forEach((d,i)=>{
    ['pres','estar','ir','pps'].forEach(t=>{
      if(t==='estar' && !d.cont) return;
      if(d.inf==='estar' && (t==='estar'||t==='ir')) return;
      const v = DATA.verbs.find(x=>x.inf===d.inf);
      if(t==='pps' && (!v || !v.pps)) return;
      POOL.push({id:'ch'+i+t, kind:'conjh', di:i, tense:t, unit:d.unit, group:'conj', irr:!!(v&&v.irr)});
    });
  });
  NUM_SET.forEach(n=>{
    const unit = n<=50?1: n<=160?2: 4;
    POOL.push({id:'nw'+n, kind:'numw', n, unit, theme:'números', group:'rules'});
    POOL.push({id:'nh'+n, kind:'numh', n, unit, theme:'números', group:'rules'});
  });
  HORA_SET.forEach(t=>{
    POOL.push({id:'hw'+t, kind:'horaw', t, unit:3, theme:'horas', group:'rules'});
    POOL.push({id:'hh'+t, kind:'horah', t, unit:3, theme:'horas', group:'rules'});
  });
  DATA.qw.forEach((x,i)=>{
    POOL.push({id:'qw'+i, kind:'qw', i, unit:3, qwg:x.g, group:'trans'});
    POOL.push({id:'qh'+i, kind:'qwh', i, unit:3, qwg:x.g, group:'trans'});
  });
  DATA.complex.forEach((x,i)=>
    POOL.push({id:'cx'+i, kind:'cx', i, unit:7, cxg:x.g, rule:x.rule, group:'trans'}));
  DATA.antonyms.forEach((x,i)=>
    POOL.push({id:'a'+i, kind:'anto', i, unit:7, theme:'antónimos', group:'vocab'}));
  DATA.gaps.forEach((x,i)=> POOL.push({id:'x'+i, kind:'gap', i, unit:x.unit, rule:x.rule, group:'rules'}));
  DATA.mc.forEach((x,i)=>  POOL.push({id:'m'+i, kind:'mc',  i, unit:x.unit, rule:x.rule, group:'rules'}));
  DATA.trans.forEach((x,i)=>POOL.push({id:'t'+i, kind:'trans', i, unit:x.unit, rule:x.rule, group:'trans'}));
  // числа/часы/антонимы — сквозные, не зависят от выбранных юнитов
  const CROSS = new Set(['numw','numh','horaw','horah','anto']);
  POOL = POOL.filter(p => CROSS.has(p.kind) || S.set.units.includes(p.unit));
}

/* ---------- подбор сессии ---------- */
function pickSession(n, filter){
  const pool = POOL.filter(filter || (()=>true));
  const due = pool.filter(p=>isDue(p.id));
  due.sort((a,b)=> (S.items[a.id].due||'').localeCompare(S.items[b.id].due||''));
  const out = due.slice(0, n);
  if(out.length < n){
    if(S.newDay !== today()){ S.newDay = today(); S.newToday = 0; }
    let budget = filter ? 999 : Math.max(0, S.set.newPerDay - S.newToday);
    const fresh = shuffle(pool.filter(p=>isNew(p.id)));
    const w = S.set.focus, quota = {conj:0,trans:0,rules:0,vocab:0};
    const need = n - out.length;
    Object.keys(quota).forEach(k => quota[k] = Math.round(need * w[k]/100));
    for(const p of fresh){
      if(out.length>=n || budget<=0) break;
      const g = p.group;
      if(quota[g] > 0){ out.push(p); quota[g]--; budget--; }
    }
    for(const p of fresh){ if(out.length>=n||budget<=0) break; if(!out.includes(p)){ out.push(p); budget--; } }
    // если дневной лимит новых исчерпан, всё равно добираем сессию до полной длины
    for(const p of fresh){ if(out.length>=n) break; if(!out.includes(p)) out.push(p); }
  }
  if(out.length < n){ // добираем слабыми
    const weak = pool.filter(p=>S.items[p.id] && !out.includes(p))
                     .sort((a,b)=> (S.items[b.id].w||0)-(S.items[a.id].w||0));
    out.push(...weak.slice(0, n-out.length));
  }
  if(out.length < n){ // всё уже пройдено — повторяем досрочно (ближайшие по сроку первыми)
    const rest = pool.filter(p=>!out.includes(p))
      .sort((a,b)=> (((S.items[a.id]||{}).due)||'9999').localeCompare((((S.items[b.id]||{}).due)||'9999')));
    out.push(...rest.slice(0, n-out.length));
  }
  return shuffle(out);
}
function themeOfDay(){

function themePool(th){
  const keys = new Set(th.vt);
  return POOL.filter(p => (p.theme && keys.has(p.theme)) ||

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const rnd = a => a[Math.floor(Math.random()*a.length)];

const AI_SYS = `Ты проверяешь ответы ученицы уровня A1 по европейскому португальскому (учебник Português a Valer 1).
Вопрос один: ДОПУСТИМ ли её ответ — грамматически корректен и решает ли коммуникативную задачу. Совпадение с образцом НЕ требуется.
ok=true, если ответ грамматичен и по делу. Допустимы и НЕ являются ошибкой:
- другой порядок слов, синонимы, опущенное подлежащее, отсутствие запятых;
- стилистические варианты: quero/queria, por favor/faz favor/se faz favor, olá/bom dia, obrigado/obrigada;
- иная, но корректная формулировка той же мысли.
Регистр букв (заглавная/строчная) НЕ считается ошибкой — полностью игнорируй его и не упоминай.
Если в задании по-русски не указано число («вы» без пометки), считай верными И você/о senhor (вежливо к одному), И vocês (к нескольким) — не считай выбор обращения ошибкой.
Поле «для_справки_один_из_вариантов» дано ТОЛЬКО чтобы ты понял смысл задания. Оцени фразу ученицы саму по себе, как её оценил бы носитель: грамматична ли она и решает ли задачу. НИКОГДА не сравнивай с этим полем и не ссылайся на него.
Другое вопросительное слово, другая конструкция, другой порядок слов — НЕ ошибка, если получившаяся фраза корректна и уместна. Например «Чем ты занимаешься? (профессия)»: верны и «O que fazes?», и «Qual é a tua profissão?», и «Em que trabalhas?». Запрещённые формулировки: «не совпадает с образцом», «неверный выбор слова для этого вопроса», «в задании указано другое», «отличается от примера».

ok=false ТОЛЬКО при реальных ошибках: неверное спряжение или форма глагола, неверный предлог/артикль/род,
пропущенная диакритика (cafe вместо café), не тот смысл, слова не по-португальски, бразилизмы вместо европейской нормы (в т.ч. gerúndio: estou falando).
Отвечай ТОЛЬКО JSON: {"ok": true/false, "why": "...", "fix": "минимально исправленный вариант ответа ученицы (пустая строка, если ошибок нет)"}
Поле "why": если ошибок нет — одно предложение, почему вариант хорош. Если есть — перечисли ВСЕ ошибки, каждую с новой строки в формате «слово → исправление — короткое объяснение почему (род, спряжение, предлог и т.п.)». Не пропускай ни одной ошибки, включая согласование рода и числа.`;

async function aiJudge(payload){
  const key = aiKey();
  if(!key) return null;
  try{
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({
        model:'gpt-4o-mini', temperature:0,
        response_format:{type:'json_object'},
        messages:[{role:'system',content:AI_SYS},{role:'user',content:JSON.stringify(payload)}]
      })
    });
    if(!r.ok) return {err: r.status===401 ? 'ключ не принят (401)' : 'ошибка API '+r.status};
    const j = await r.json();
    return JSON.parse(j.choices[0].message.content);
  }catch(e){ return {err:'нет связи с AI'}; }
}

/* принять ответ как верный задним числом */
function acceptAnswer(q){
  const idx = SES ? SES.i : -1;
  if(!SES) return;
  schedule(q.id, true);
  if(SES.log[idx]===0){ SES.log[idx]=1; SES.right++; SES.wrong--; }
  SES.again = SES.again.filter(p=>p.id!==q.p.id && p!==q.p);
  const a = (SES.answers||[]).slice(-1)[0];
  if(a && !a.ok){ a.ok = true; a.aiAccepted = true; }
  const d = today(); if(S.hist[d] && S.hist[d].ok < S.hist[d].n) S.hist[d].ok++;
  save();
}

/* спросить AI после локального «неверно» в обычных заданиях */
function aiSecondOpinion(q, given){
  if(!aiKey() || !given || !given.trim()) return;
  const box = document.createElement('div');
  box.className = 'verdict'; box.style.marginTop = '8px';
  box.innerHTML = '<span class="small muted">🤖 спрашиваю AI, допустим ли ваш вариант…</span>';
  const v = document.getElementById('verdict');
  if(!v) return;
  const anchor = v.querySelector('.ruleref');           // сразу под вердиктом, выше правил
  if(anchor) v.insertBefore(box, anchor); else v.appendChild(box);
  const taskRu = (q.gap ? q.gap.replace(/<[^>]+>/g,'') : (q.prompt||'').replace(/<[^>]+>/g,''));
  aiJudge({
    'задание': q.label + ': ' + taskRu + (q.hintLabel? ' ['+q.hintLabel+']':''),
    'для_справки_один_из_вариантов': q.answers ? q.answers[0] : q.correct,
    'ответ_ученицы': given
  }).then(res=>{
    if(!res){ box.remove(); return; }
    if(res.err){ box.innerHTML = `<span class="small muted">🤖 ${esc(res.err)}</span>`; return; }
    if(res.ok){
      acceptAnswer(q);
      const first = v.querySelector('.verdict.no');
      if(first){
        first.classList.remove('no'); first.classList.add('ok');
        first.querySelectorAll('.wr').forEach(e=>{
          e.style.cssText='color:inherit;text-decoration:none;font-weight:inherit';
          e.classList.remove('wr');
        });
        const big = first.querySelector('.big');
        if(big && !big.textContent.startsWith('✓')) big.insertAdjacentText('afterbegin','✓ ');
      }
      box.classList.add('ok');
      box.innerHTML = `<div class="big" style="font-size:15px">🤖 Засчитано: ваш вариант допустим</div>
        <div class="ru">${esc(res.why||'')}</div>`;
    }else{
      box.classList.add('no');
      box.innerHTML = `<div class="big" style="font-size:15px">🤖 AI подтверждает ошибку</div>
        <div class="ru" style="white-space:pre-line">${esc(res.why||'')}</div>
        ${res.fix? `<div class="ru">исправление: <b>${esc(res.fix)}</b></div>`:''}`;
    }
  });
}

/* AI-верификация ПРИНЯТОГО ответа в диалоге (принят по ключам, не дословно) */
function aiDialogVerify(step, text){
  if(!aiKey() || !text) return;
  const models = [step.model, ...(step.models||[])];
  if(models.some(m => canon(m) === canon(text))) return;   // дословное совпадение — AI не нужен
  const v = document.getElementById('verdict');
  if(!v) return;
  const box = document.createElement('div');
  box.className = 'verdict'; box.style.marginTop = '8px';
  box.innerHTML = '<span class="small muted">🤖 проверяю грамматику…</span>';
  const okBox = v.querySelector('.verdict.ok');
  if(okBox && okBox.nextSibling) v.insertBefore(box, okBox.nextSibling); else v.appendChild(box);
  aiJudge({
    'ситуация': (DLG&&DLG.d? DLG.d.title+'. '+DLG.d.brief : ''),
    'собеседник_сказал': step.say,
    'задание': step.task,
    'для_справки_один_из_вариантов': step.model,
    'ответ_ученицы': text
  }).then(res=>{
    if(!res || res.err){ box.remove(); return; }
    if(res.ok){
      box.innerHTML = `<span class="small" style="color:var(--accent)">🤖 AI подтверждает: грамматика верна${res.why? ' · '+esc(res.why):''}</span>`;
    }else{
      // честно понижаем вердикт
      if(okBox){ okBox.classList.remove('ok'); okBox.classList.add('no'); }
      DLG.ok = Math.max(0, DLG.ok-1);
      const a = DLG.answers.slice(-1)[0];
      if(a){ a.ok = false; a.missing = a.missing||[]; }
      box.classList.add('no');
      box.innerHTML = `<div class="big" style="font-size:15px">🤖 AI нашёл ошибку</div>
        <div class="ru" style="white-space:pre-line">${esc(res.why||'')}</div>
        ${res.fix? `<div class="ru">правильно: <b>${esc(res.fix)}</b>
          <button class="speak" onclick="say('${esc(res.fix).replace(/'/g,"\\'")}')">🔊</button></div>`:''}`;
    }
  });
}

/* ---------- формирование вопроса ---------- */
function makeQ(p){ if(p._pre) return p._pre;
  const q = {p, id:p.id};
  if(p.kind==='vocab'){
    const m = S.items[p.id];
    let production = m && m.b >= 2;        // сначала узнавание, потом производство
    if(SES && SES.mode==='rec') production = false;
    if(SES && SES.mode==='prod') production = true;
    if(production){
      q.type='input'; q.label='Переведите на португальский';
      q.prompt=p.ru; q.answers=[p.pt, (p.art? p.art+' '+p.pt : p.pt)];
      q.speakAfter=p.pt; q.note = p.art ? 'артикль не обязателен' : '';
    }else{
      q.type='choice'; q.label='Что это значит?'; q.prompt=(p.art? p.art+' ':'')+p.pt;
      q.speakNow=p.pt;
      const others = shuffle(DATA.vocab.filter(w=>w.theme===p.theme && w.ru!==p.ru)).slice(0,3);
      while(others.length<3){ const c=rnd(DATA.vocab); if(c.ru!==p.ru && !others.includes(c)) others.push(c); }
      q.options = shuffle([p.ru, ...others.map(o=>o.ru)]); q.correct=p.ru;
    }
  }
  else if(p.kind==='gender'){
    q.type='choice'; q.label='Какой артикль?'; q.prompt='___ '+p.pt;
    q.sub=p.ru; q.options=['o','a','os','as']; q.correct=p.art; q.speakAfter=p.art+' '+p.pt;
  }
  else if(p.kind==='conj'){
    const v = DATA.verbs[p.vi];
    let ps = [0,1,2,3,4].filter(i => conjForm(v,p.tense,i));
    const i = rnd(ps), form = conjForm(v,p.tense,i);
    q.type='input'; q.label=TENSES[p.tense].name;
    q.conj={v, tense:p.tense, person:i};
    q.prompt=`${PERSONS[i]} — <span style="color:var(--accent)">${v.inf}</span>`;
    const MK = {pres:'обычно', estar:'прямо сейчас', ir:'завтра', pps:'вчера'};
    const SUBJ_LC = ['я','ты','она','мы','они'];
    q.subHtml = `${esc(v.ru)} · <b style="color:var(--warn)">${TENSES[p.tense].short} — ${MK[p.tense]} ${SUBJ_LC[i]}…</b>`;
    q.answers=[form];
    if(!v.impersonal) PERSONS[i].split(', ').forEach(pr=> q.answers.push(pr+' '+form));
    q.speakAfter=form;
  }
  else if(p.kind==='conjh'){
    const d = DATA.verbDrills[p.di];
    const persons = [0,1,2,3,4];
    const pers = rnd(persons);
    const pt = ptPhrase(d, p.tense, pers);
    const correct = ruPhrase(d, p.tense, pers);
    const opts = [correct];
    let guard = 0;
    while(opts.length < 4 && guard++ < 60){
      const t2 = rnd(['pres','estar','ir','pps'].filter(t=>
        !(t==='estar' && !d.cont) && !(d.inf==='estar' && (t==='estar'||t==='ir'))));
      const p2 = rnd(persons);
      if(!ptPhrase(d, t2, p2)) continue;
      const ru2 = ruPhrase(d, t2, p2);
      if(!opts.includes(ru2)) opts.push(ru2);
    }
    q.type='choice'; q.label='Спряжение на слух — что это значит?';
    q.prompt='🔊'; q.sub='прослушайте фразу и выберите перевод';
    q.speakNow=pt; q.speakAfter=pt;
    q.options=shuffle(opts); q.correct=correct;
    q.rule = p.tense==='pres'?'pres_regulares':p.tense==='estar'?'estar_a':p.tense==='ir'?'ir_inf':'pps_regulares';
  }
  else if(p.kind==='numw'){
    q.type='input'; q.label='Напишите число словами';
    q.prompt=String(p.n); q.answers=[numToPt(p.n)];
    q.speakAfter=numToPt(p.n); q.rule='números';
  }
  else if(p.kind==='numh'){
    q.type='input'; q.label='Число на слух — запишите цифрами';
    q.prompt='🔊'; q.sub='нажмите динамик, чтобы прослушать ещё раз';
    q.answers=[String(p.n)]; q.speakNow=numToPt(p.n); q.speakAfter=numToPt(p.n);
    q.rule='números'; q.note='пишите цифрами: 42';
  }
  else if(p.kind==='horaw'){
    q.type='input'; q.label='Скажите время по-португальски';
    q.prompt='🕐 '+p.t; q.answers=horaWords(p.t);
    q.speakAfter=horaWords(p.t)[0]; q.rule='horas';
  }
  else if(p.kind==='horah'){
    q.type='input'; q.label='Время на слух — запишите цифрами';
    q.prompt='🔊'; q.sub='например: 14:30';
    q.answers=horaDigits(p.t); q.speakNow=horaWords(p.t)[0];
    q.speakAfter=horaWords(p.t)[0]; q.rule='horas';
  }
  else if(p.kind==='qw'){
    const c = DATA.qw[p.i];
    q.type='input'; q.big=true; q.label='Задайте вопрос';
    q.prompt='Спросите: '+c.ru; q.answers=[c.pt, ...(c.alts||[])];
    q.speakAfter=c.pt; q.rule='e_que';
  }
  else if(p.kind==='qwh'){
    const c = DATA.qw[p.i];
    q.type='choice'; q.label='Вопрос на слух — о чём спросили?';
    q.prompt='🔊'; q.sub='прослушайте вопрос и выберите перевод';
    q.speakNow=c.pt; q.speakAfter=c.pt;
    const others = shuffle(DATA.qw.filter(x=>x.ru!==c.ru)).slice(0,3).map(x=>x.ru);
    q.options=shuffle([c.ru, ...others]); q.correct=c.ru; q.rule='e_que';
  }
  else if(p.kind==='cx'){
    const c = DATA.complex[p.i];
    q.type='input'; q.big=true; q.label='Сложное предложение';
    q.prompt=c.ru; q.answers=[c.pt, ...(c.alts||[])];
    q.speakAfter=c.pt; q.rule=c.rule;
  }
  else if(p.kind==='anto'){
    const a = DATA.antonyms[p.i];
    const fwd = Math.random()<.5;
    const from = fwd? a[0] : a[1], to = fwd? a[1] : a[0];
    q.type='input'; q.label='Назовите антоним';
    q.prompt = from; q.sub = a[2];
    q.answers=[to]; q.speakAfter = from + ' — ' + to;
  }
  else if(p.kind==='gap'){
    const g = DATA.gaps[p.i];
    q.type='input'; q.label='Вставьте пропущенное';
    q.gap=g.s; q.answers=[g.a, ...(g.alts||[])]; q.note=g.hint||'';
    q.speakAfter=g.s.replace(/___/g, g.a.replace(/\|/g,' … '));
  }
  else if(p.kind==='mc'){
    const m = DATA.mc[p.i];
    q.type='choice'; q.label='Выберите правильный вариант'; q.gap=m.s;
    q.options=shuffle([m.a, ...m.wrong]); q.correct=m.a; q.note=m.hint||'';
    q.speakAfter=m.s.replace(/___/g, m.a);
  }
  else if(p.kind==='trans'){
    const t = DATA.trans[p.i];
    q.type='input'; q.label='Переведите на португальский'; q.prompt=t.ru;
    q.answers=[t.pt, ...(t.alts||[])]; q.speakAfter=t.pt; q.big=true;
  }
  q.rule = p.rule;
  return q;
}

/* ---------- сессия ---------- */
let SES = null;
function startSession(filter, title, mode){
  buildPool();
  const items = pickSession(S.set.len, filter);
  if(!items.length){ alert('Нет заданий по этому фильтру — проверьте выбранные юниты в настройках.'); return; }
  SES = {queue:[], i:0, right:0, wrong:0, again:[], log:[],
         title:title||'Ежедневная тренировка', mode: mode||null};
  SES.queue = items.map(makeQ);
  renderSession();
}
function renderSession(){
  const v = document.getElementById('view');
  if(SES.i >= SES.queue.length) return finishSession();
  const q = SES.queue[SES.i];
  const n = SES.queue.length, prog = Math.round(SES.i/n*100);
  let body = '';
  const speakBtn = q.speakAfter||q.speakNow ? `<button class="speak" id="sp" title="Прослушать">🔊</button>` : '';
  const hintBtn = q.hintLabel
    ? ` <button class="btn ghost" id="lblHint" style="padding:2px 10px;font-size:11px;border-radius:99px">показать подсказку</button>` : '';
  const retryTag = (SES.retryOf===q.id) ? ' · исправление' : '';
  const head = `<div class="qtype">${esc(q.label)}${SES.repeat?' · повтор':''}${retryTag} ${speakBtn}${hintBtn}</div>`;

  if(q.gap){
    body += `<div class="gapline">${q.gap.replace(/___/g,'<u>&nbsp;</u>')}</div>`;
  }else{
    body += `<div class="prompt${q.big?'':' pt'}">${q.prompt}${
      q.subHtml?`<small>${q.subHtml}</small>` : q.sub?`<small>${esc(q.sub)}</small>`:''}</div>`;
  }
  if(q.type==='input'){
    body += `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="${q.big?'португальская фраза…':'ответ…'}">`;
    body += `<div class="accents">` + ['á','à','â','ã','ç','é','ê','í','ó','ô','õ','ú'].map(c=>`<button data-c="${c}">${c}</button>`).join('') + `</div>`;
    if(q.note) body += `<div class="small muted" style="margin-top:8px">💡 ${esc(q.note)}</div>`;
    body += `<div class="row" style="margin-top:14px"><button class="btn" id="go">Проверить</button>
             <button class="btn ghost" id="skip">Не знаю</button>
             <button class="btn ghost" id="dict" title="Продиктовать (pt-PT)">🎤</button></div>`;
  }else{
    body += `<div class="opts">` + q.options.map((o,i)=>
      `<button class="opt" data-o="${esc(o)}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('') + `</div>`;
  }
  const dots = SES.queue.map((_,i)=>`<i class="${SES.log[i]===1?'done':SES.log[i]===2?'fixed':SES.log[i]===0?'bad':''}"></i>`).join('');
  v.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn ghost small" id="quit" style="padding:6px 10px;font-size:13px">← выйти</button>
        <span class="small muted">${SES.i+1} / ${n}</span>
        <div class="dots">${dots}</div>
      </div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      ${head}${body}
      <div id="verdict"></div>
    </div>`;
  document.getElementById('quit').onclick = ()=>{ SES=null; save(); home(); };
  const sp = document.getElementById('sp'); if(sp) sp.onclick = ()=> say(q.speakNow||q.speakAfter);
  const lh = document.getElementById('lblHint');
  if(lh) lh.onclick = ()=>{ lh.outerHTML = `<span style="color:var(--accent);font-weight:600">${esc(q.hintLabel)}</span>`; };
  if(q.speakNow) setTimeout(()=>say(q.speakNow), 250);
  if(q.type==='input'){
    const inp = document.getElementById('ans'); inp.focus();
    document.querySelectorAll('.accents button').forEach(b=> b.onclick=()=>{
      const s=inp.selectionStart; inp.value = inp.value.slice(0,s)+b.dataset.c+inp.value.slice(inp.selectionEnd);
      inp.focus(); inp.selectionStart=inp.selectionEnd=s+1; });
    document.getElementById('go').onclick = ()=> answer(q, inp.value);
    document.getElementById('skip').onclick = ()=> answer(q, '', true);
    const dictBtn = document.getElementById('dict');
    if(typeof SR!=='undefined' && SR) dictBtn.onclick = ()=> toggleDictation(inp, dictBtn);
    else dictBtn.style.display='none';
    inp.onkeydown = e=>{
      if(e.key==='Escape' && typeof stopDictation==='function'){ e.preventDefault(); stopDictation(); return; }
      if(e.key==='Enter'){ e.preventDefault(); answer(q, inp.value); } };
  }else{
    document.querySelectorAll('.opt').forEach(b=> b.onclick = ()=> answer(q, b.dataset.o));
    document.onkeydown = e=>{ const n=parseInt(e.key); if(n>=1&&n<=q.options.length){ const b=document.querySelectorAll('.opt')[n-1]; b&&b.click(); } };
  }
}

function answer(q, given, skipped){
  if(typeof stopDictation==='function') stopDictation();
  const isRetry = SES && SES.retryOf === q.id;
  let res;
  if(q.type==='choice') res = {ok: !skipped && norm(given)===norm(q.correct), target:q.correct};
  else res = skipped ? {ok:false, target:q.answers[0]} : check(given, q.answers);
  if(skipped) res.ok = false;
  const ok = res.ok;
  if(!isRetry){ schedule(q.id, ok); SES.log[SES.i] = ok?1:0; }
  else if(ok && SES.log[SES.i]===0){ SES.log[SES.i] = 2; }   // 2 = исправлено
  SES.answers = SES.answers || [];
  SES.answers.push({q: q.gap || q.prompt.replace(/<[^>]+>/g,''), given: (given||'').trim(),
                    target: res.target, ok, near: !!res.near});
  if(!isRetry){ ok ? SES.right++ : SES.wrong++; if(!ok) SES.again.push(q.p); }
  if(!isRetry){
    const d = today(); S.hist[d] = S.hist[d] || {n:0,ok:0}; S.hist[d].n++; if(ok) S.hist[d].ok++;
    if(isNewCounted(q.id)) S.newToday++;
  }
  save();

  // визуальная разметка вариантов
  if(q.type==='choice'){
    document.querySelectorAll('.opt').forEach(b=>{
      if(norm(b.dataset.o)===norm(q.correct)) b.classList.add('ok');
      else if(norm(b.dataset.o)===norm(given)) b.classList.add('no');

const U_SUBJ = ["У меня","У тебя","У неё","У нас","У них"];
const BE_PAST = ["была","был(а)","была","были","были"];
function ruPhrase(d, tense, p, mk){
  if(tense==='pps') mk = mk || PPS_MARKERS[0];
  const subj = DATA.subjRu[p];
  if(d.inf==='estar'){
    if(tense==='pres') return `${subj} сейчас ${d.objRu}.`;
    return `${(mk||PPS_MARKERS[0]).ru} ${subj.toLowerCase()} ${BE_PAST[p]} ${d.objRu}.`;
  }
  if(d.inf==='ter'){
    if(tense==='pres') return `${U_SUBJ[p]} ${d.objRu}.`;
    if(tense==='ir') return `Завтра ${U_SUBJ[p].toLowerCase()} будет ${d.objRu}.`;
    return `${(mk||PPS_MARKERS[0]).ru} ${U_SUBJ[p].toLowerCase()} был ${d.objRu}.`;
  }
  const wrap = s2 => (s2).replace(/\s+/g,' ').replace(' .','.');
  const preRu = (mk && mk.pos!=='suf' && ['pres','estar','ir'].includes(tense)) ? mk.ru+' ' : '';
  const lc = s2 => preRu ? s2.toLowerCase() : s2;
  if(tense==='pres') return wrap(`${preRu}${lc(subj)} ${d.ruPres[p]} ${d.objRu}.`);
  if(tense==='estar'){
    const cue = preRu || 'Сейчас ';
    return wrap(`${cue}${subj.toLowerCase()} ${d.ruPres[p]} ${d.objRu}.`);
  }
  if(tense==='ir'){
    const rf = DATA.ruFut[d.inf];
    const core = rf ? `${lc(subj)} ${rf[p]} ${d.objRu}.` : `${lc(subj)} ${DATA.futRu[p]} ${d.ruInf} ${d.objRu}.`;
    return wrap(preRu + core);
  }
  const v = p===0||p===2 ? d.ruPastF : (p===1 ? d.ruPastF.replace(/ла( |$)/,'л(а)$1') : d.ruPastP);
  if(mk && mk.pos==='suf') return wrap(`${subj} ${v} ${d.objRu} ${mk.ru}.`);
  return wrap(`${mk.ru} ${subj.toLowerCase()} ${v} ${d.objRu}.`);
}
function ptPhrase(d, tense, p, mk){
  if(tense==='pps') mk = mk || PPS_MARKERS[0];
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  const f = conjForm(v, tense, p);
  if(!f) return null;
  const subj = DATA.subjPt[p];
  let pre = '', suf = '';
  if(mk && mk.pos==='suf') suf = ' ' + mk.pt;
  else if(tense==='pps') pre = mk.pt + ', ';
  else if(mk && ['pres','estar','ir'].includes(tense)) pre = mk.pt + ', ';
  else if(tense==='ir' && d.inf==='ter') pre = 'Amanhã, ';
  const sj = pre ? (subj==='Eu'?'eu':subj[0].toLowerCase()+subj.slice(1)) : subj;
  return (`${pre}${pre? sj : subj} ${f} ${d.obj}${suf}.`).replace(/\s+/g,' ').replace(' .','.');
}
function ptVariants(pt){
  const out = [pt];
  const MKPRE = /^(Ontem|Amanhã|Depois|Agora|Neste momento|Todos os dias|Todo o dia|Ao fim de semana|Às vezes|Muitas vezes|Poucas vezes|Na semana passada|No mês passado|No ano passado|No fim de semana passado|Na próxima semana|No próximo mês|No próximo ano|No próximo fim de semana), /i;
  const noAdv = pt.replace(MKPRE,'').replace(/ pela (primeira|segunda|terceira) vez\./,'.');
  if(noAdv!==pt) out.push(noAdv.charAt(0).toUpperCase()+noAdv.slice(1));
  for(const base of [...out]){
    const m = base.match(/^((?:Ontem|Amanhã|Depois|Agora|Neste momento|Todos os dias|Todo o dia|Ao fim de semana|Às vezes|Muitas vezes|Poucas vezes|Na semana passada|No mês passado|No ano passado|No fim de semana passado|Na próxima semana|No próximo mês|No próximo ano|No próximo fim de semana), )?(eu|tu|ela|nós|eles)\s+(.+)$/i);
    if(m){
      const rest = m[3];
      const v = (m[1]||'') + rest.charAt(0).toUpperCase() + rest.slice(1);
      if(!out.includes(v)) out.push(v);
    }
  }
  return out;
}

function periQuestion(d, v, peri, p){

  let pastForm = p===0||p===2 ? pastF : (p===1 ? pastF.replace(/ла( |$)/,'л(а)$1') : pastP);
  if(!pastForm) pastForm = ['закончила','закончил(а)','закончила','закончили','закончили'][p] + ' ' + (d.ruInf||'');
  const ru = peri.usePres
    ? `${DATA.subjRu[p]} обычно ${d.ruPres[p]} ${d.objRu}.`
    : peri.recem
    ? `${peri.ru[p]} ${pastForm} ${d.objRu}.`
    : `${peri.ru[p]} ${d.ruInf} ${d.objRu}${peri.id==='queria (cortesia)' ? ', пожалуйста' : ''}.`;

 {pt:'fome',   k:'dat', ru:{pres:'хочется есть', pps:'хотелось есть', ir:'будет хотеться есть'}},
 {pt:'sede',   k:'dat', ru:{pres:'хочется пить', pps:'хотелось пить', ir:'будет хотеться пить'}},
 {pt:'frio',   k:'dat', ru:{pres:'холодно', pps:'было холодно', ir:'будет холодно'}},
 {pt:'calor',  k:'dat', ru:{pres:'жарко', pps:'было жарко', ir:'будет жарко'}},
 {pt:'medo',   k:'dat', ru:{pres:'страшно', pps:'было страшно', ir:'будет страшно'}},
 {pt:'pressa', k:'u',   ru:{pres:'спешка — я спешу', pps:'была спешка', ir:'будет спешка'}},
 {pt:'sorte',  k:'dat', ru:{pres:'везёт', pps:'повезло', ir:'повезёт'}},
 {pt:'azar',   k:'dat', ru:{pres:'не везёт', pps:'не повезло', ir:'не повезёт'}},
 {pt:'dores de cabeça',   k:'u', ru:{pres:'болит голова', pps:'болела голова', ir:'будет болеть голова'}},
 {pt:'dores de barriga',  k:'u', ru:{pres:'болит живот', pps:'болел живот', ir:'будет болеть живот'}},
 {pt:'dores de garganta', k:'u', ru:{pres:'болит горло', pps:'болело горло', ir:'будет болеть горло'}},
 {pt:'dores de costas',   k:'u', ru:{pres:'болит спина', pps:'болела спина', ir:'будет болеть спина'}},
];
const RU_DAT = ['Мне','Тебе','Ей','Нам','Им'];
const RU_U   = ['У меня','У тебя','У неё','У нас','У них'];
function stateQuestions(primary, tense, n){
  const vTer = DATA.verbs.find(x=>x.inf==='ter');
  const vEstar = DATA.verbs.find(x=>x.inf==='estar');
  const out = [];
  shuffle(STATES).slice(0, n).forEach(st=>{
    const p = Math.floor(Math.random()*5);
    const terF = conjForm(vTer, tense, p);
    const estF = conjForm(vEstar, tense, p);
    if(!terF || !estF) return;
    const terS = `${terF.charAt(0).toUpperCase()+terF.slice(1)} ${st.pt}.`;
    const estS = `${estF.charAt(0).toUpperCase()+estF.slice(1)} com ${st.pt}.`;
    const answers = [];
    const order = primary==='estar' ? [ [estF, ' com'], [terF, ''] ] : [ [terF, ''], [estF, ' com'] ];
    order.forEach(([f, com])=>{
      const base = `${f} ${com? com.trim()+' ':''}${st.pt}.`.replace(/\s+/g,' ');
      answers.push(base.charAt(0).toUpperCase()+base.slice(1));
      PERSONS[p].split(', ').forEach(pr=> answers.push(`${pr} ${f}${com} ${st.pt}.`));
    });
    const subjRu = (st.k==='dat'? RU_DAT : RU_U)[p];
    const mk = tense==='pps' ? rnd(PPS_MARKERS).ru+' ' : tense==='ir' ? 'Завтра ' : '';
    const ru = `${mk}${mk? subjRu.toLowerCase() : subjRu} ${st.ru[tense==='estar'?'pres':tense] || st.ru.pres}.`;
    out.push({ru, pt: primary==='estar'? estS : terS, answers,
              hint:'ter + nome  ·  estar com + nome', rule:'estar_com_ter'});
  });
  return out;
}
/* императив: fala / não fales · fale / não fale · falem / não falem */
const IMP_SKIP = new Set(['ser','estar','poder','querer','haver','doer','chover','nevar','saber']);
const IMP_SPECIAL = {
  ir:  {tu:'vai', stem:'vá', pl:'vão', tuN:'vás'},
  dar: {tu:'dá',  stem:'dê', pl:'deem', tuN:'dês'},
};
function impForms(inf){
  if(inf.endsWith('-se')) return null;               // возвратные — отдельная тема
  const v = DATA.verbs.find(x=>x.inf===inf);
  if(!v || v.impersonal || IMP_SKIP.has(inf)) return null;
  const sp = IMP_SPECIAL[inf];
  if(sp){
    return {tuA:sp.tu, tuN:'não '+sp.tuN, vcA:sp.stem, vcN:'não '+sp.stem,
            vsA:sp.pl, vsN:'não '+sp.pl};
  }
  const eu = v.pres[0];
  if(!eu || !eu.endsWith('o')) return null;
  let stem = eu.slice(0,-1);
  if(inf.endsWith('car')) stem = stem.slice(0,-1)+'qu';
  else if(inf.endsWith('gar')) stem = stem+'u';
  else if(inf.endsWith('çar')) stem = stem.slice(0,-1)+'c';
  const vw = inf.endsWith('ar') ? 'e' : 'a';
  return {tuA: v.pres[2], tuN: 'não '+stem+vw+'s',
          vcA: stem+vw,   vcN: 'não '+stem+vw,
          vsA: stem+vw+'m', vsN: 'não '+stem+vw+'m'};
}
const IMP_CARDS = [
 {k:'tuA', who:'tu',    ru:'приказ на «ты»: сделай!'},
 {k:'tuN', who:'tu',    ru:'запрет на «ты»: не делай!'},
 {k:'vcA', who:'você',  ru:'вежливый приказ: сделайте!'},
 {k:'vcN', who:'você',  ru:'вежливый запрет: не делайте!'},
 {k:'vsA', who:'vocês', ru:'к нескольким: сделайте!'},
 {k:'vsN', who:'vocês', ru:'к нескольким: не делайте!'},
];
function impQuestions(inf, n){
  const f = impForms(inf); if(!f) return [];
  const v = DATA.verbs.find(x=>x.inf===inf);
  return shuffle(IMP_CARDS).slice(0, n||6).map(c=>({
    label:`${inf} · Imperativo`,
    prompt:`${c.who} — <span style="color:var(--accent)">${inf}</span>`,
    subHtml:`${esc(v.ru)} · <b style="color:var(--warn)">${esc(c.ru)}</b>`,
    answers:[f[c.k], f[c.k].charAt(0).toUpperCase()+f[c.k].slice(1)+'!'],
    pt:f[c.k], rule:'imperativo', card:true
  }));
}
function tensesForDrill(d){
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  return ['pres','estar','ir','pps'].filter(t=>{
    if(t==='pps' && !v.pps) return false;
    if(d.inf==='estar' && (t==='estar'||t==='ir')) return false;
    if(!d.cont && t==='estar') return false;
    return true;
  });
}
function startVerbDay(drill){
  const d = drill || verbOfDay();
  const v = DATA.verbs.find(x=>x.inf===d.inf);
  const tenses = tensesForDrill(d);
  const steps = [];
  tenses.forEach(t=>{
    const ps = shuffle([0,1,2,3,4]).slice(0, t==='pres'?5:3);
    ps.forEach(p=>{
      const mk = markerFor(d, t);
      const pt = ptPhrase(d,t,p,mk); if(!pt) return;
      steps.push({t, p, ru: ruPhrase(d,t,p,mk), pt});
    });
  });
  // ter / estar: состояния во всех временах
  if(d.inf==='ter' || d.inf==='estar'){
    const stTenses = d.inf==='ter' ? ['pres','pps','ir'] : ['pres','pps'];
    stTenses.forEach(t=>{
      stateQuestions(d.inf, t, 1).forEach(sq=>{
        steps.push({t:'state', ru:sq.ru, pt:sq.pt, answers:sq.answers, rule:sq.rule});
      });
    });
  }
  // конструкции: 3 случайные, применимые к глаголу
  if(!v.impersonal && d.inf!=='estar'){
    const cands = PERIS.filter(pe =>
      pe.id.split(' ')[0] !== d.inf &&          // не дублируем сам глагол дня
      (!pe.needCont || d.cont) &&
      (!pe.skill || SKILL_VERBS.has(d.inf)) &&
      (!pe.usePres || d.ruPres) &&
      !(d.inf==='poder' && ['querer','conseguir','dever (obrigação moral)','queria (cortesia)'].includes(pe.id)) &&
      !(d.inf==='querer' && pe.id==='queria (cortesia)'));
    shuffle(cands).slice(0,5).forEach(pe=>{
      const ps = pe.persons || [0,1,2,3,4];
      const p = ps[Math.floor(Math.random()*ps.length)];
      const q = periQuestion(d, v, pe, p);
      steps.push({t:'peri', p, ru:q.ru, pt:q.pt, peri:pe, answers:q.answers});
    });
  }
  SES = {queue: shuffle(steps).map(s=>{ const q = ({
      p:{id:'vd-'+d.inf+'-'+s.t+'-'+s.p, kind:'trans', unit:d.unit, group:'trans',
         rule: s.t==='pres'?'pres_regulares':s.t==='estar'?'estar_a':s.t==='ir'?'ir_inf':'pps_regulares'},
      id:'vd-'+d.inf+'-'+s.t+'-'+s.p,
      type:'input', big:true,
      label: 'Глагол дня',
      hintLabel: s.t==='state' ? `${d.inf} · состояние: ter + nome / estar com + nome`
        : s.t==='peri' ? `${d.inf} · конструкция ${s.peri.id} + Infinitivo`
        : `${d.inf} · ${TENSES[s.t].name}`,
      prompt: s.ru, answers: s.answers || ptVariants(s.pt),
      speakAfter: s.pt,
      rule: s.rule || (s.t==='peri' ? s.peri.rule
        : (s.t==='pres'?'pres_regulares':s.t==='estar'?'estar_a':s.t==='ir'?'ir_inf':'pps_regulares')),
      conj: (s.t==='peri'||s.t==='state') ? null : {v, tense:s.t, person:s.p}
    }); q.p._pre = q; return q; }), i:0, right:0, wrong:0, again:[], log:[], title:'Глагол дня'};
  renderSession();
}

function startStory(st){
  if(st.slots) st = instantiateDialog(st);   // случайные значения слотов на каждый запуск
  const steps = st.phrases.map((ph,i)=>{ const q = ({
    p:{id:'st-'+st.unit+'-'+st.title+'-'+i, kind:'trans', unit:st.unit, group:'trans', rule:null},
    id:'st-'+st.unit+'-'+st.title+'-'+i,
    type:'input', big:true,
    label:`История: ${st.title} · фраза ${i+1} из ${st.phrases.length}`,
    prompt: ph.ru, answers:[ph.pt, ...(ph.alts||[])],
    speakAfter: ph.pt, story:{st, i}
  }); q.p._pre = q; return q; });
  SES = {queue:steps, i:0, right:0, wrong:0, again:[], log:[], title:'История: '+st.title,
         storyDone:st};
  renderSession();
}
function storiesFor(unit){
  return DATA.stories.filter(s=> unit? s.unit===unit : S.set.units.includes(s.unit));
}
function storyOfDay(){
  const list = storiesFor(null);
  return list[lessonNum() % list.length];
}

let dictRec = null, dictActive = false, dictBtnEl = null, dictAccum = '';
function toggleDictation(inp, btn){
  if(dictActive){ stopDictation(); return; }
  speechSynthesis.cancel();
  dictRec = new SR();
  dictRec.lang = 'pt-PT'; dictRec.interimResults = true; dictRec.continuous = true;
  const deadline = Date.now() + 15000;
  dictActive = true; dictBtnEl = btn; dictAccum = '';
  btn.textContent = '◼ стоп'; btn.style.background = 'var(--warn)';
  btn.style.color = '#fff'; btn.style.borderColor = 'var(--warn)';
  dictRec.onresult = e=>{
    let t = ''; for(const r of e.results) t += r[0].transcript + ' ';
    inp.value = (dictAccum + ' ' + t).trim();
  };
  dictRec.onerror = e=>{ if(e.error !== 'no-speech') stopDictation(); };
  dictRec.onend = ()=>{
    if(dictActive && Date.now() < deadline){
      dictAccum = inp.value;                       // не теряем сказанное при перезапуске
      try{ dictRec.start(); return; }catch(err){}
    }
    stopDictation();
  };
  dictRec.start();
  inp.focus();
}
function stopDictation(){
  dictActive = false;
  if(dictRec){ dictRec.onend = null; try{ dictRec.stop(); }catch(e){} dictRec = null; }
  if(dictBtnEl){ dictBtnEl.textContent = '🎤'; dictBtnEl.style.background = ''; dictBtnEl.style.color = ''; dictBtnEl = null; }
}

let DLG = null;
function instantiateDialog(d){
  if(!d.slots) return d;
  const chosen = {};
  for(const k in d.slots) chosen[k] = d.slots[k][Math.floor(Math.random()*d.slots[k].length)];
  const sub = s => s.replace(/\{(\w+)\.(\w+)\}/g,
    (m,a,b)=> (chosen[a] && chosen[a][b]!==undefined) ? chosen[a][b] : m);
  const deep = o => typeof o==='string' ? sub(o)
    : Array.isArray(o) ? o.map(deep)
    : (o && typeof o==='object') ? Object.fromEntries(Object.entries(o).map(([k,v])=>[k,deep(v)]))
    : o;
  const inst = deep(Object.assign({}, d, {slots:null}));
  inst.slots = null;
  return inst;
}
function startDialog(d){
  DLG = {d: instantiateDialog(d), i:0, ok:0, tries:0, answers:[]};
  renderDialogIntro();
}

  const mic = document.getElementById('mic');
  if(SR) mic.onclick = ()=> toggleRec(s);
  else { mic.style.opacity=.4; mic.style.cursor='default'; }
