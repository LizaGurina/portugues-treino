<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Português a Valer 1 — ежедневный тренажёр</title>
<style>
:root{
  --bg:#faf7f2; --panel:#fff; --ink:#1d1b18; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#0a6b4d; --accent-soft:#e3f1ea; --warn:#b3261e; --warn-soft:#fbe9e7;
  --gold:#b98900; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14130f; --panel:#1d1c18; --ink:#f0ece5; --muted:#a09a90; --line:#2f2d27;
        --accent:#4cc79b; --accent-soft:#12352a; --warn:#ff8a80; --warn-soft:#3a1c19;
        --gold:#e0b34d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.chip b{color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px 18px;
  font-weight:600;font-size:15px;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.hot{border-color:var(--warn);color:var(--warn);font-weight:700}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  text-align:left;transition:border-color .15s,transform .05s}
.mode:hover{border-color:var(--accent)}
.mode:active{transform:scale(.99)}
.mode .t{font-weight:640;font-size:14.5px;margin-bottom:3px}
.mode .d{font-size:12.5px;color:var(--muted);line-height:1.4}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* --- session --- */
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.prompt{font-size:24px;line-height:1.35;font-weight:600;letter-spacing:-.02em;margin:2px 0 6px}
.prompt.pt{font-style:normal}
.prompt small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0}
.gapline{font-size:20px;line-height:1.5;font-weight:500}
.gapline u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 22px}
input.answer{width:100%;font:inherit;font-size:19px;padding:13px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:14px}
input.answer:focus{outline:none;border-color:var(--accent)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.accents button{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  min-width:34px;height:32px;font-size:15px;color:var(--ink)}
.accents button:hover{background:var(--accent-soft)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);
  border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:16.5px;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt .k{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:6px;background:var(--line);font-size:12px;color:var(--muted);flex:none}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--warn);background:var(--warn-soft)}
.verdict{margin-top:14px;padding:13px 15px;border-radius:11px;font-size:15px;line-height:1.5}
.verdict.ok{background:var(--accent-soft);border:1px solid var(--accent)}
.verdict.no{background:var(--warn-soft);border:1px solid var(--warn)}
.verdict .big{font-size:18px;font-weight:640;letter-spacing:-.01em}
.verdict .ru{color:var(--muted);font-size:14px;margin-top:4px}
.diff b{background:rgba(185,137,0,.28);border-radius:3px;padding:0 1px}
.wr{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:3px;font-weight:600}
.miss{opacity:.55;text-decoration:line-through}
.speak{background:none;border:none;color:var(--muted);font-size:17px;padding:2px 6px;border-radius:8px}
.speak:hover{background:var(--accent-soft);color:var(--accent)}
.ruleref{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.ruleref b{color:var(--ink)}
table.conj{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
table.conj td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.conj td:first-child{color:var(--muted);width:42%}
table.conj tr.hi td{background:var(--accent-soft);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.02em}
.rule{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--panel);overflow:hidden}
.rule>summary{padding:14px 16px;cursor:pointer;font-weight:620;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.rule>summary::-webkit-details-marker{display:none}
.rule>summary:after{content:"›";margin-left:auto;color:var(--muted);transform:rotate(90deg);transition:.2s}
.rule[open]>summary:after{transform:rotate(270deg)}
.rule .body{padding:0 16px 16px;font-size:14.5px;line-height:1.6}
.rule .ex{margin-top:10px;border-left:2px solid var(--accent);padding-left:12px}
.rule .ex div{margin-bottom:7px}
.rule .ex .p{font-weight:560}
.rule .ex .r{color:var(--muted);font-size:13.5px}
.statline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.statline .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:99px;background:var(--line);width:90px;overflow:hidden;flex:none}
.mini>i{display:block;height:100%;background:var(--accent)}
label.set{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px}
label.set input,label.set select{margin-left:auto;font:inherit}
.hidden{display:none!important}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent)}
.dots i.bad{background:var(--warn)}
.dots i.fixed{background:var(--gold)}
.done-hero{text-align:center;padding:26px 10px}
.done-hero .em{font-size:44px}
.done-hero h3{margin:10px 0 6px;font-size:20px}
kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>Português&nbsp;a&nbsp;Valer&nbsp;1 <span class="muted" style="font-weight:400">· A1</span></h1>
  <div class="spacer"></div>
  <span class="chip" id="streakChip">🔥 <b>0</b></span>
  <span class="chip" id="dueChip">к повтору <b>0</b></span>
  <button class="chip" id="topSet" title="Настройки" style="cursor:pointer">⚙️</button>
</header>
<div id="view"></div>
</div>

const DATA = /*__DATA__*/;
const BUILD_ID = '__BUILD__';
